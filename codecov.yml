# Codecov configuration for omero-docker-extended
# https://docs.codecov.io/docs/codecov-yaml
# Validate changes with:
#   curl --data-binary @codecov.yml https://codecov.io/validate

# Files and directories excluded from coverage analysis entirely.
# These contain no testable Python source code (shell scripts, configs,
# Dockerfiles, documentation, templates, static assets).
ignore:
  - "conftest.py"
  - "startup/"
  - "monitoring/"
  - "docker/"
  - "tools/"
  - "docs/"
  - "scripts/"
  - "env/"
  - "**/templates/"
  - "**/static/"

coverage:
  status:
    # Keep an overall project gate plus package-scoped status checks so Codecov
    # surfaces weak runtime areas directly in commit/PR status output.
    project:
      default:
        target: auto
        threshold: 1%
      plugin-common:
        target: auto
        paths:
          - "omero_plugin_common/"
        threshold: 1%
      omp-plugin:
        target: auto
        paths:
          - "omeroweb_omp_plugin/"
        threshold: 1%
      import-plugin:
        target: auto
        paths:
          - "omeroweb_import/"
        threshold: 1%
      admin-tools:
        target: auto
        paths:
          - "omeroweb_admin_tools/"
        threshold: 1%
      imaris-connector:
        target: auto
        paths:
          - "omeroweb_imaris_connector/"
        threshold: 1%
    # Patch coverage: only newly added / changed lines are evaluated.
    patch:
      default:
        target: 0%
        threshold: 1%

component_management:
  individual_components:
    - component_id: omero_plugin_common
      name: omero_plugin_common
      paths:
        - "omero_plugin_common/**"
    - component_id: omeroweb_omp_plugin
      name: omeroweb_omp_plugin
      paths:
        - "omeroweb_omp_plugin/**"
    - component_id: omeroweb_import
      name: omeroweb_import
      paths:
        - "omeroweb_import/**"
    - component_id: omeroweb_admin_tools
      name: omeroweb_admin_tools
      paths:
        - "omeroweb_admin_tools/**"
    - component_id: omeroweb_imaris_connector
      name: omeroweb_imaris_connector
      paths:
        - "omeroweb_imaris_connector/**"

codecov:
  notify:
    after_n_builds: 1

# Codecov's current GitHub Checks annotations conflict with Components, so keep
# the richer PR comment/UI component breakdown and turn annotations off
# explicitly.
github_checks:
  annotations: false

comment:
  layout: "header, diff, components, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  after_n_builds: 1
