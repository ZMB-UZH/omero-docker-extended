# Codecov configuration for omero-docker-extended
# https://docs.codecov.io/docs/codecov-yaml

# Files and directories excluded from coverage analysis entirely.
# These contain no testable Python source code (shell scripts, configs,
# Dockerfiles, documentation, templates, static assets).
ignore:
  - "conftest.py"
  - "startup/"
  - "monitoring/"
  - "docker/"
  - "tools/"
  - "docs/"
  - "scripts/"
  - "env/"
  - "omero_imaris_connector/XTOmeroConnector.py"
  - "**/templates/"
  - "**/static/"

coverage:
  status:
    # Per-component project-level checks.  ``default`` is disabled so that
    # only the explicitly listed components post commit statuses.
    project:
      default: false
      plugin-common:
        target: 100%
        paths:
          - 'omero_plugin_common/'
          - '!.*/tests/.*'
        threshold: 0%
      omp-plugin:
        target: 100%
        paths:
          - 'omeroweb_omp_plugin/'
          - '!.*/tests/.*'
        threshold: 0%
      import-plugin:
        target: 100%
        paths:
          - 'omeroweb_import/'
          - '!.*/tests/.*'
        threshold: 0%
      admin-tools:
        target: 100%
        paths:
          - 'omeroweb_admin_tools/'
          - '!.*/tests/.*'
        threshold: 0%
      imaris-connector:
        target: 100%
        paths:
          - 'omero_imaris_connector/'
          - '!.*/tests/.*'
        threshold: 0%
      tools-plugin:
        target: 100%
        paths:
          - 'omeroweb_tools/'
          - '!.*/tests/.*'
        threshold: 0%
      web-zarr:
        target: 100%
        paths:
          - 'omero_web_zarr/'
          - '!.*/tests/.*'
        threshold: 0%
    # Patch coverage: only newly added / changed lines are evaluated.
    patch:
      default:
        target: 100%
        threshold: 0%

codecov:
  notify:
    after_n_builds: 1

comment:
  require_changes: true
  after_n_builds: 1
