# Codecov configuration for omero-docker-extended
# https://docs.codecov.io/docs/codecov-yaml

# Files and directories excluded from coverage analysis entirely.
# These contain no testable Python source code (shell scripts, configs,
# Dockerfiles, documentation, templates, static assets).
ignore:
  - "conftest.py"
  - "startup/"
  - "monitoring/"
  - "docker/"
  - "tools/"
  - "docs/"
  - "scripts/"
  - "env/"
  - "**/templates/"
  - "**/static/"

coverage:
  status:
    # Per-component project-level checks.  ``default`` is disabled so that
    # Codecov still evaluates the full tracked codebase in addition to the
    # component-specific breakdowns below. This keeps test-only coverage gains
    # visible even when no production file changed in the diff.
    project:
      default:
        target: auto
        threshold: 1%
      plugin-common:
        target: auto
        paths:
          - 'omero_plugin_common/'
          - '!.*/tests/.*'
        threshold: 1%
      omp-plugin:
        target: auto
        paths:
          - 'omeroweb_omp_plugin/'
          - '!.*/tests/.*'
        threshold: 1%
      import-plugin:
        target: auto
        paths:
          - 'omeroweb_import/'
          - '!.*/tests/.*'
        threshold: 1%
      admin-tools:
        target: auto
        paths:
          - 'omeroweb_admin_tools/'
          - '!.*/tests/.*'
        threshold: 1%
      imaris-connector:
        target: auto
        paths:
          - 'omeroweb_imaris_connector/'
          - '!.*/tests/.*'
        threshold: 1%
    # Patch coverage: only newly added / changed lines are evaluated.
    patch:
      default:
        target: 0%
        threshold: 1%

codecov:
  notify:
    after_n_builds: 1

comment:
  require_changes: false
  after_n_builds: 1
