repos:
  - repo: local
    hooks:
      - id: agent-tool-preflight
        name: Verify mandatory agent-tool execution
        entry: python3 tools/agent_preflight.py check
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
