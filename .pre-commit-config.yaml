repos:
  - repo: local
    hooks:
      - id: agent-tool-preflight
        name: Verify mandatory agent-tool execution
        entry: python3 tools/agent_preflight.py check
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
