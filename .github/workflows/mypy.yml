name: mypy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: Mypy
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
          cache: 'pip'
          cache-dependency-path: |
            .github/requirements/tests-ci.txt
            .github/requirements/mypy-ci.txt

      - name: Install type-check dependencies
        run: |
          python3 -m pip install --require-hashes --requirement .github/requirements/tests-ci.txt
          python3 -m pip install --require-hashes --requirement .github/requirements/mypy-ci.txt

      - name: Run Mypy
        run: |
          python3 tools/mypy_check.py
