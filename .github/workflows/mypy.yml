name: mypy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: Mypy
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
          cache: 'pip'
          cache-dependency-path: |
            .github/requirements/tests-ci.txt
            .github/requirements/mypy-ci.txt

      - name: Install type-check dependencies
        run: |
          python3 -m pip install --require-hashes --requirement .github/requirements/tests-ci.txt
          python3 -m pip install --require-hashes --requirement .github/requirements/mypy-ci.txt

      - name: Run Mypy
        run: |
          python3 tools/mypy_check.py
