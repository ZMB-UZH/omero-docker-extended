name: mypy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: Mypy
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.4'
          cache: 'pip'
          cache-dependency-path: |
            .github/requirements/tests-ci.txt
            .github/requirements/mypy-ci.txt

      - name: Install type-check dependencies
        run: |
          python3 -m pip install --require-hashes --requirement .github/requirements/tests-ci.txt
          python3 -m pip install --require-hashes --requirement .github/requirements/mypy-ci.txt

      - name: Run Mypy
        run: |
          python3 tools/mypy_check.py
