name: tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-with-coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade "pip==26.0.1"
          python3 -m pip install --requirement .github/requirements/tests-ci.txt

      # Each test suite MUST be a separate invocation — the root
      # conftest.py installs mock stubs that interfere across test
      # modules when run in a single process.  Coverage data files
      # are written with unique suffixes and combined afterwards.
      - name: Run all test suites with coverage
        id: tests
        run: |
          set +e
          EXIT_FINAL=0

          echo "::group::tests/"
          COVERAGE_FILE=.coverage.root \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omero_plugin_common/tests/"
          COVERAGE_FILE=.coverage.common \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omero_plugin_common/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omeroweb_imaris_connector/tests/"
          COVERAGE_FILE=.coverage.imaris \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omeroweb_imaris_connector/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omeroweb_admin_tools/tests/"
          COVERAGE_FILE=.coverage.admin \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omeroweb_admin_tools/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omeroweb_omp_plugin/tests/"
          COVERAGE_FILE=.coverage.omp \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omeroweb_omp_plugin/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omeroweb_import/tests/"
          COVERAGE_FILE=.coverage.import \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omeroweb_import/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omero_web_zarr/tests/"
          COVERAGE_FILE=.coverage.zarr \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omero_web_zarr/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          exit $EXIT_FINAL

      - name: Combine coverage and generate report
        if: always()
        run: |
          python3 -m coverage combine --rcfile=.coveragerc
          python3 -m coverage xml --rcfile=.coveragerc
          python3 -m coverage report --rcfile=.coveragerc

      - name: Validate Codecov token
        if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "${CODECOV_TOKEN}" ]; then
            echo "::error::CODECOV_TOKEN is missing. Configure repository secrets before running coverage upload."
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
