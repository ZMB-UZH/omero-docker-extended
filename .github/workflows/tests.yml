name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-with-coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Keep CI coverage runs reproducible and aligned with the
          # runtime-tested native Zarr toolchain.
          python3 -m pip install -r requirements-tests.txt

      # Each test suite MUST be a separate invocation — the root
      # conftest.py installs mock stubs that interfere across test
      # modules when run in a single process.  Coverage data files
      # are written with unique suffixes and combined afterwards.
      - name: Run all test suites with coverage
        id: tests
        run: |
          set +e
          EXIT_FINAL=0

          echo "::group::tests/"
          COVERAGE_FILE=.coverage.root \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omero_plugin_common/tests/"
          COVERAGE_FILE=.coverage.common \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omero_plugin_common/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omeroweb_imaris_connector/tests/"
          COVERAGE_FILE=.coverage.imaris \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omeroweb_imaris_connector/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omeroweb_admin_tools/tests/"
          COVERAGE_FILE=.coverage.admin \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omeroweb_admin_tools/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omeroweb_omp_plugin/tests/"
          COVERAGE_FILE=.coverage.omp \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omeroweb_omp_plugin/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          echo "::group::omeroweb_import/tests/"
          COVERAGE_FILE=.coverage.import \
            python3 -m coverage run --rcfile=.coveragerc \
            -m pytest omeroweb_import/tests/ -v -p no:cacheprovider -W error
          [ $? -ne 0 ] && EXIT_FINAL=1
          echo "::endgroup::"

          exit $EXIT_FINAL

      - name: Combine coverage and generate report
        if: always()
        run: |
          if ! ls .coverage.* >/dev/null 2>&1; then
            echo "::error::No split coverage data files were produced."
            exit 1
          fi
          for data_file in .coverage.root .coverage.common .coverage.imaris .coverage.admin .coverage.omp .coverage.import; do
            if [ ! -f "$data_file" ]; then
              echo "::error::Missing coverage data file: $data_file"
              exit 1
            fi
          done
          mkdir -p coverage-suites
          python3 -m coverage xml --rcfile=.coveragerc --data-file=.coverage.root -o coverage-suites/root-regressions.xml
          python3 -m coverage xml --rcfile=.coveragerc --data-file=.coverage.common -o coverage-suites/plugin-common-tests.xml
          python3 -m coverage xml --rcfile=.coveragerc --data-file=.coverage.imaris -o coverage-suites/imaris-connector-tests.xml
          python3 -m coverage xml --rcfile=.coveragerc --data-file=.coverage.admin -o coverage-suites/admin-tools-tests.xml
          python3 -m coverage xml --rcfile=.coveragerc --data-file=.coverage.omp -o coverage-suites/omp-plugin-tests.xml
          python3 -m coverage xml --rcfile=.coveragerc --data-file=.coverage.import -o coverage-suites/import-plugin-tests.xml
          python3 -m coverage combine --rcfile=.coveragerc
          python3 -m coverage xml --rcfile=.coveragerc
          python3 -m coverage json --rcfile=.coveragerc -o coverage.json --pretty-print
          python3 -m coverage html --rcfile=.coveragerc -d coverage-html
          python3 -m coverage report --rcfile=.coveragerc -m | tee coverage-report.txt
          python3 tools/coverage_summary.py \
            --coverage-json coverage.json \
            --output-md coverage-summary.md \
            --top-files 40
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        id: upload_coverage_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            coverage.json
            coverage-report.txt
            coverage-summary.md
            coverage-suites/
            coverage-html/
          if-no-files-found: error
          retention-days: 14

      - name: Publish coverage artifact link
        if: always() && steps.upload_coverage_artifacts.outcome == 'success'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Coverage Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download the HTML and raw coverage artifacts](${{ steps.upload_coverage_artifacts.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Codecov token
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "${CODECOV_TOKEN}" ]; then
            echo "::error::CODECOV_TOKEN is missing. Configure repository secrets before running coverage upload."
            exit 1
          fi

      - name: Upload root-regressions coverage to Codecov
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-suites/root-regressions.xml
          flags: root-regressions
          name: root-regressions
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload plugin-common-tests coverage to Codecov
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-suites/plugin-common-tests.xml
          flags: plugin-common-tests
          name: plugin-common-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload imaris-connector-tests coverage to Codecov
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-suites/imaris-connector-tests.xml
          flags: imaris-connector-tests
          name: imaris-connector-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload admin-tools-tests coverage to Codecov
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-suites/admin-tools-tests.xml
          flags: admin-tools-tests
          name: admin-tools-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload omp-plugin-tests coverage to Codecov
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-suites/omp-plugin-tests.xml
          flags: omp-plugin-tests
          name: omp-plugin-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload import-plugin-tests coverage to Codecov
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-suites/import-plugin-tests.xml
          flags: import-plugin-tests
          name: import-plugin-tests
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
