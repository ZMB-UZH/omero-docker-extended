name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-with-coverage:
    name: Tests with coverage
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Codecov's OIDC upload token exchange.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
          cache: 'pip'
          cache-dependency-path: |
            .github/requirements/tests-ci.txt
            .github/requirements/vulture-ci.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep xvfb xauth libtk8.6
          python3 -m pip install --require-hashes \
            --requirement .github/requirements/tests-ci.txt \
            --requirement .github/requirements/vulture-ci.txt

      - name: Verify Redis session persistence and migration
        run: python3 tools/run_local_workflow_gates.py --profile redis

      # Each test suite MUST be a separate invocation — the root
      # conftest.py installs mock stubs that interfere across test
      # modules when run in a single process.  Coverage data files
      # are written with unique suffixes and combined afterwards.
      - name: Run all test suites with coverage
        id: tests
        run: |
          python3 tools/run_local_workflow_gates.py --profile tests --keep-going \
            --artifact-dir "${RUNNER_TEMP}/test-coverage"

      - name: Upload coverage to Codecov
        if: always() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
