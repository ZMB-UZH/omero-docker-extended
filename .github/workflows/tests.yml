name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-with-coverage:
    name: Tests with coverage
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Codecov's OIDC upload token exchange.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.4'
          cache: 'pip'
          cache-dependency-path: .github/requirements/tests-ci.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --require-hashes --requirement .github/requirements/tests-ci.txt

      # Each test suite MUST be a separate invocation — the root
      # conftest.py installs mock stubs that interfere across test
      # modules when run in a single process.  Coverage data files
      # are written with unique suffixes and combined afterwards.
      - name: Run all test suites with coverage
        id: tests
        run: |
          EXIT_FINAL=0

          run_suite() {
            local coverage_file="$1"
            local suite_label="$2"
            local suite_path="$3"

            echo "::group::${suite_label}"
            if ! COVERAGE_FILE="${coverage_file}" \
              python3 -m coverage run --rcfile=.coveragerc \
              -m pytest "${suite_path}" -v -p no:cacheprovider -W error; then
              EXIT_FINAL=1
            fi
            echo "::endgroup::"
          }

          run_suite .coverage.root tests/ tests/
          run_suite .coverage.common omero_plugin_common/tests/ omero_plugin_common/tests/
          run_suite .coverage.imaris omero_imaris_connector/tests/ omero_imaris_connector/tests/
          run_suite .coverage.admin omeroweb_admin_tools/tests/ omeroweb_admin_tools/tests/
          run_suite .coverage.omp omeroweb_omp_plugin/tests/ omeroweb_omp_plugin/tests/
          run_suite .coverage.import omeroweb_import/tests/ omeroweb_import/tests/
          run_suite .coverage.tools omeroweb_tools/tests/ omeroweb_tools/tests/
          run_suite .coverage.zarr omero_web_zarr/tests/ omero_web_zarr/tests/

          exit $EXIT_FINAL

      - name: Combine coverage and generate report
        if: always()
        run: |
          python3 -m coverage combine --rcfile=.coveragerc
          python3 -m coverage xml --rcfile=.coveragerc
          python3 -m coverage report --rcfile=.coveragerc

      - name: Upload coverage to Codecov
        if: always() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
