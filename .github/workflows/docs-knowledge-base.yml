name: docs-knowledge-base

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

jobs:
  docs-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate docs structure
        run: python3 tools/lint_docs_structure.py

      - name: Run docs lint tests
        run: python3 -m unittest -v tests/test_lint_docs_structure.py
