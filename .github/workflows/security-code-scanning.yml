name: security-code-scanning

on:
  pull_request:
    branches:
      - main
      - alpha
  push:
    branches:
      - main
      - alpha
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-code-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  trivy-filesystem:
    name: Trivy filesystem scan (SARIF)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        run: semgrep scan --sarif --config auto . > semgrep-results.sarif

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        if: always()

  bandit:
    name: Bandit Python security scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install "bandit[sarif]"

      - name: Discover test directories
        id: find-tests
        run: |
          # Auto-discover all test directories matching tests/ or test/ at any depth
          TEST_DIRS=$(find omero_plugin_common/ omeroweb_omp_plugin/ omeroweb_upload/ \
            omeroweb_admin_tools/ omeroweb_imaris_connector/ \
            -type d \( -name 'tests' -o -name 'test' \) 2>/dev/null \
            | tr '\n' ' ')
          echo "test_dirs=${TEST_DIRS}" >> "$GITHUB_OUTPUT"
          echo "Found test directories: ${TEST_DIRS:-none}"

      - name: Run Bandit scan (production code — excludes test directories)
        run: >-
          bandit -r
          omero_plugin_common/
          omeroweb_omp_plugin/
          omeroweb_upload/
          omeroweb_admin_tools/
          omeroweb_imaris_connector/
          --exclude '*/tests,*/test'
          --skip B603,B404
          -f sarif
          -o bandit-prod.sarif
          --exit-zero

      - name: Run Bandit scan (test code — skips assert and test-credential rules)
        if: steps.find-tests.outputs.test_dirs != ''
        run: >-
          bandit -r
          ${{ steps.find-tests.outputs.test_dirs }}
          --skip B101,B106,B603,B404
          -f sarif
          -o bandit-test.sarif
          --exit-zero

      - name: Merge Bandit SARIF results
        run: |
          python3 -c "
          import json, sys, os
          merged = None
          for path in ['bandit-prod.sarif', 'bandit-test.sarif']:
              if not os.path.exists(path):
                  continue
              try:
                  with open(path) as f:
                      data = json.load(f)
              except json.JSONDecodeError:
                  continue
              if merged is None:
                  merged = data
              else:
                  for run in data.get('runs', []):
                      merged.setdefault('runs', []).append(run)
          if merged:
              with open('bandit-results.sarif', 'w') as f:
                  json.dump(merged, f)
          else:
              sys.exit(1)
          "

      - name: Upload Bandit results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        if: always()

  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/omero-web.Dockerfile
          - docker/omero-server.Dockerfile
          - docker/omero-celery-worker.Dockerfile
          - docker/pg-maintenance.Dockerfile
          - docker/redis-sysctl-init.Dockerfile
          - docker/crowdsec.Dockerfile
          - docker/firewall-bouncer.Dockerfile
          - docker/path-usage-exporter.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-${{ matrix.dockerfile }}
        if: always()

  devskim:
    name: DevSkim security lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DevSkim scan
        uses: microsoft/DevSkim-Action@v1
        with:
          directory-to-scan: .
          ignore-globs: "**/.git/**,**/pgdata/**,**/omero_data/**,**/omero_temp/**"
          exclude-rules: DS162092

      - name: Upload DevSkim results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif
          category: devskim
        if: always()

  osv-scanner:
    name: OSV dependency vulnerability scan
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.0
    with:
      scan-args: |-
        --recursive
        ./

  scorecard:
    name: OSSF Scorecard supply-chain security
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        continue-on-error: true
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
        if: always()
