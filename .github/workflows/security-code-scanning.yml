name: security

on:
  push:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-code-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for CodeQL analysis metadata on workflow runs.
      contents: read
      security-events: write # Required to upload CodeQL results to code scanning.
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit — explain CodeQL language candidates
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="${RUNNER_TEMP:?RUNNER_TEMP is required}"
          python_sources="$(mktemp "${tmp_dir%/}/codeql-python-sources.XXXXXX")"
          python_stubs="$(mktemp "${tmp_dir%/}/codeql-python-stubs.XXXXXX")"
          js_candidates="$(mktemp "${tmp_dir%/}/codeql-js-candidates.XXXXXX")"
          trap 'rm -f "$python_sources" "$python_stubs" "$js_candidates"' EXIT

          git ls-files '*.py' ':!:third_party/**' > "$python_sources"
          git ls-files '*.pyi' > "$python_stubs"
          git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' ':!:third_party/**' > "$js_candidates"

          echo "::group::CodeQL language candidate files"
          if [ "${{ matrix.language }}" = "python" ]; then
            echo "CodeQL Python implementation source candidates (.py): $(wc -l < "$python_sources" | tr -d ' ')"
            echo "Python type stubs not counted as CodeQL Python source (.pyi): $(wc -l < "$python_stubs" | tr -d ' ')"
            echo "--- .py implementation files ---"
            cat "$python_sources"
            echo "--- .pyi type stubs checked by Ruff/Mypy, not CodeQL Python source ---"
            cat "$python_stubs"
          else
            echo "Tracked JavaScript/TypeScript-family candidates: $(wc -l < "$js_candidates" | tr -d ' ')"
            echo "--- Application/test JS/TS candidates ---"
            grep -v '^\.agents/' "$js_candidates" || true
            echo "--- Agent/tool JS configs audited here, but may be outside CodeQL UI source counts ---"
            grep '^\.agents/' "$js_candidates" || true
          fi
          echo "::endgroup::"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          dependency-caching: true
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never

      - name: Reject CodeQL findings before upload
        shell: bash
        env:
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-results
        run: python3 tools/sarif_result_guard.py "${CODEQL_RESULTS}"/*.sarif

      - name: Upload CodeQL results to GitHub Security tab
        id: upload-sarif
        if: success()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}

      - name: Verify accepted CodeQL analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-sarif.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

  trivy-filesystem:
    name: Trivy filesystem scan (SARIF)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for SARIF uploads to resolve workflow run metadata.
      contents: read
      security-events: write # Required to upload Trivy results to code scanning.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit — list files in scan scope
        run: |
          echo "::group::Trivy filesystem scan scope"
          echo "Scanning lockfiles and config files for dependency vulnerabilities, misconfigs, secrets, and license compliance."
          echo "--- Dependency manifests ---"
          find . -maxdepth 5 \( -name 'requirements*.txt' -o -name 'Pipfile.lock' \
            -o -name 'poetry.lock' -o -name 'package-lock.json' -o -name 'yarn.lock' \
            -o -name 'Gemfile.lock' -o -name 'go.sum' -o -name 'pom.xml' \) \
            -not -path './.git/*' -not -path './third_party/*' | sort
          echo "--- Config files (misconfig scan) ---"
          find . -maxdepth 5 \( -name 'Dockerfile' -o -name '*.Dockerfile' \
            -o -name 'docker-compose*.yml' -o -name '*.yaml' -o -name '*.yml' \
            -o -name '*.tf' -o -name '*.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './third_party/*' | sort | head -100
          echo "::endgroup::"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,misconfig,secret,license
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: third_party

      - name: Reject Trivy findings before upload
        run: python3 tools/sarif_result_guard.py trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
        if: success()

      - name: Verify accepted Trivy analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-sarif.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

  semgrep:
    name: Semgrep SAST
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for SARIF uploads to resolve workflow run metadata.
      contents: read
      security-events: write # Required to upload Semgrep results to code scanning.
    container:
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit — list files in scan scope
        run: |
          echo "::group::Semgrep scan scope"
          echo "Scanning all source files for SAST findings."
          echo "--- Python files ---"
          find . -name '*.py' -not -path './.git/*' -not -path './third_party/*' | wc -l
          find . -name '*.py' -not -path './.git/*' -not -path './third_party/*' | sort
          echo "--- JavaScript/TypeScript files ---"
          find . \( -name '*.js' -o -name '*.ts' -o -name '*.jsx' -o -name '*.tsx' \) \
            -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './third_party/*' | sort
          echo "--- HTML templates ---"
          find . -name '*.html' -not -path './.git/*' -not -path './third_party/*' | sort
          echo "--- YAML/JSON config ---"
          find . \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './third_party/*' | sort | head -50
          echo "::endgroup::"

      - name: Run Semgrep scan
        run: semgrep scan --sarif --config auto --exclude third_party . > semgrep-results.sarif

      - name: Preserve unmodified Semgrep report and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep-results.sarif
          if-no-files-found: error

      - name: Reject Semgrep findings before upload
        run: python3 tools/sarif_result_guard.py semgrep-results.sarif

      - name: Upload Semgrep results to GitHub Security tab
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        if: success()

      - name: Verify accepted Semgrep analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-sarif.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

  bandit:
    name: Bandit Python security scan
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for SARIF uploads to resolve workflow run metadata.
      contents: read
      security-events: write # Required to upload Bandit results to code scanning.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          cache: 'pip'
          cache-dependency-path: .github/requirements/security-code-scanning.txt

      - name: Install Bandit
        run: python3 -m pip install --require-hashes --requirement .github/requirements/security-code-scanning.txt

      - name: Run Bandit across first-party Python sources
        run: >-
          python3 tools/run_local_workflow_gates.py
          --profile bandit --artifact-dir "${RUNNER_TEMP}/bandit"

      - name: Preserve unmodified Bandit reports and scope inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-reports
          path: ${{ runner.temp }}/bandit
          if-no-files-found: error

      - name: Build legacy Bandit cleanup SARIF
        if: always()
        env:
          BANDIT_REPORT_DIR: ${{ runner.temp }}/bandit
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          os.chdir(os.environ["BANDIT_REPORT_DIR"])
          template_path = None
          for path in ("bandit-prod.sarif", "bandit-test.sarif"):
              if os.path.exists(path) and os.path.getsize(path) > 0:
                  template_path = path
                  break

          if template_path is None:
              sys.exit("No Bandit SARIF template was generated.")

          with open(template_path, encoding="utf-8") as handle:
              data = json.load(handle)

          runs = data.get("runs", [])
          if not runs:
              sys.exit("Bandit SARIF template contained no runs.")

          run = runs[0]
          run["results"] = []
          if "artifacts" in run:
              run["artifacts"] = []
          if "invocations" in run:
              run["invocations"] = []

          driver = run.get("tool", {}).get("driver", {})
          if "rules" in driver:
              driver["rules"] = []
          if run.get("tool", {}).get("extensions"):
              run["tool"]["extensions"] = []

          data["runs"] = [run]

          with open("bandit-legacy-cleanup.sarif", "w", encoding="utf-8") as handle:
              json.dump(data, handle)
          PY

      - name: Reject Bandit production findings before upload
        run: python3 tools/sarif_result_guard.py "${RUNNER_TEMP}/bandit/bandit-prod.sarif"

      - name: Reject Bandit test findings before upload
        run: python3 tools/sarif_result_guard.py "${RUNNER_TEMP}/bandit/bandit-test.sarif"

      - name: Validate empty legacy Bandit cleanup report
        run: python3 tools/sarif_result_guard.py "${RUNNER_TEMP}/bandit/bandit-legacy-cleanup.sarif"

      - name: Upload Bandit production results to GitHub Security tab
        id: upload-prod
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/bandit/bandit-prod.sarif
          category: bandit-prod
        if: success()

      - name: Verify accepted Bandit production analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-prod.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

      - name: Upload Bandit test results to GitHub Security tab
        id: upload-test
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/bandit/bandit-test.sarif
          category: bandit-test
        if: success()

      - name: Verify accepted Bandit test analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-test.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

      - name: Upload Bandit legacy cleanup results to GitHub Security tab
        id: upload-legacy
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/bandit/bandit-legacy-cleanup.sarif
          # Keep the legacy category alive with zero results so stale pre-split alerts can close.
          category: bandit
        if: success()

      - name: Verify accepted Bandit legacy analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-legacy.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

  hadolint-discover:
    name: Discover Dockerfiles
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find all Dockerfiles
        id: find
        run: |
          FILES=$(python3 tools/run_local_workflow_gates.py --list-dockerfiles)
          echo "dockerfiles=${FILES}" >> "$GITHUB_OUTPUT"
          echo "Discovered Dockerfiles: ${FILES}"

  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    needs: hadolint-discover
    if: github.ref_name == github.event.repository.default_branch && needs.hadolint-discover.outputs.dockerfiles != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for SARIF uploads to resolve workflow run metadata.
      contents: read
      security-events: write # Required to upload Hadolint results to code scanning.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dockerfile: ${{ fromJson(needs.hadolint-discover.outputs.dockerfiles) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit — show file being scanned
        env:
          DOCKERFILE_PATH: ${{ matrix.dockerfile }}
        run: |
          echo "::group::Hadolint scan scope"
          printf 'Scanning Dockerfile: %s\n' "${DOCKERFILE_PATH}"
          wc -l -- "${DOCKERFILE_PATH}"
          echo "::endgroup::"

      - name: Run Hadolint
        # Hadolint 2.15.1 still reports these Bash Dockerfiles as POSIX sh.
        # Keep the tested engine; see the compatibility evidence in code-scanning.md.
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0, Hadolint v2.14.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Reject Hadolint findings before upload
        run: python3 tools/sarif_result_guard.py hadolint-results.sarif

      - name: Upload Hadolint results to GitHub Security tab
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-${{ matrix.dockerfile }}
        if: success()

      - name: Verify accepted Hadolint analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-sarif.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

  devskim:
    name: DevSkim security lint
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for SARIF uploads to resolve workflow run metadata.
      contents: read
      security-events: write # Required to upload DevSkim results to code scanning.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit — list files in scan scope
        run: |
          echo "::group::DevSkim scan scope"
          echo "Scanning all source files for security anti-patterns."
          echo "Excluded globs: **/.git/**, **/pgdata/**, **/omero_data/**, **/omero_temp/**, **/third_party/**"
          echo "Excluded rules: DS162092 (localhost references in container infrastructure)"
          echo "--- All scannable files ---"
          find . -type f \( -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.html' \
            -o -name '*.yml' -o -name '*.yaml' -o -name '*.json' -o -name '*.sh' \
            -o -name '*.sql' -o -name '*.xml' -o -name 'Dockerfile' -o -name '*.Dockerfile' \) \
            -not -path './.git/*' -not -path '*/pgdata/*' \
            -not -path '*/omero_data/*' -not -path '*/omero_temp/*' \
            -not -path '*/third_party/*' | sort
          echo "Total: $(find . -type f \( -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.html' \
            -o -name '*.yml' -o -name '*.yaml' -o -name '*.json' -o -name '*.sh' \
            -o -name '*.sql' -o -name '*.xml' -o -name 'Dockerfile' -o -name '*.Dockerfile' \) \
            -not -path './.git/*' -not -path '*/pgdata/*' \
            -not -path '*/omero_data/*' -not -path '*/omero_temp/*' \
            -not -path '*/third_party/*' | wc -l) files"
          echo "::endgroup::"

      - name: Reject DevSkim findings before upload
        run: python3 tools/devskim_gate.py --artifact-dir "${RUNNER_TEMP}/devskim"

      - name: Preserve the unmodified DevSkim report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devskim-report
          path: ${{ runner.temp }}/devskim/devskim-results.sarif
          if-no-files-found: warn

      - name: Upload DevSkim results to GitHub Security tab
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/devskim/devskim-results.sarif
          category: devskim
        if: success()

      - name: Verify accepted DevSkim analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-sarif.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

  osv-scanner-audit:
    name: OSV scan scope audit
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit — list dependency manifests for OSV scan
        run: |
          echo "::group::OSV-Scanner scan scope"
          echo "OSV-Scanner recursively scans dependency manifests for known vulnerabilities."
          echo "--- Dependency manifests found ---"
          find . -maxdepth 5 \( -name 'requirements*.txt' -o -name 'Pipfile' \
            -o -name 'Pipfile.lock' -o -name 'poetry.lock' -o -name 'pyproject.toml' \
            -o -name 'setup.py' -o -name 'setup.cfg' \
            -o -name 'package.json' -o -name 'package-lock.json' -o -name 'yarn.lock' \
            -o -name 'pnpm-lock.yaml' -o -name 'go.sum' -o -name 'go.mod' \
            -o -name 'Gemfile.lock' -o -name 'pom.xml' -o -name 'gradle.lockfile' \
            -o -name '*.cdx.xml' -o -name '*.cdx.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' | sort
          echo "--- Explicit CI requirements lockfiles ---"
          find .github/requirements -maxdepth 1 -type f -name '*.txt' | sort
          echo "::endgroup::"

  osv-scanner:
    name: OSV dependency vulnerability scan
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      security-events: write # Required to upload OSV results to code scanning.
      actions: read # Required for SARIF uploads to resolve workflow run metadata.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        --lockfile=requirements.txt:.github/requirements/mypy-ci.txt
        --lockfile=requirements.txt:.github/requirements/recovery-ci.txt
        --lockfile=requirements.txt:.github/requirements/security-code-scanning.txt
        --lockfile=requirements.txt:.github/requirements/tests-ci.txt
        --lockfile=requirements.txt:.github/requirements/vulture-ci.txt
        --lockfile=docker/java-dependencies.cdx.xml
        ./

  scorecard:
    name: OSSF Scorecard supply-chain security
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      security-events: write # Required to upload Scorecard results to code scanning.
      id-token: write # Required for Scorecard's publish_results provenance token.
      actions: read # Required for SARIF uploads to resolve workflow run metadata.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit — describe scan scope
        run: |
          echo "::group::OSSF Scorecard scan scope"
          echo "Scorecard evaluates repository-level supply-chain security practices."
          echo "It checks: branch protection, CI/CD config, dependency management,"
          echo "code review, contributors, vulnerability disclosure, and more."
          echo "This is a repository-level assessment, not a per-file scan."
          echo "::endgroup::"

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        continue-on-error: true
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results to GitHub Security tab
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
        if: always()

      - name: Verify accepted Scorecard analysis
        if: always() && steps.upload-sarif.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload-sarif.outputs.sarif-id }}
        run: >-
          python3 tools/security_delta_guard.py --repository "$GITHUB_REPOSITORY"
          --sarif-id "$SARIF_ID" --expected-sha "$GITHUB_SHA"

  security-delta:
    name: Zero added alerts gate
    needs:
      - codeql
      - trivy-filesystem
      - semgrep
      - bandit
      - hadolint-discover
      - hadolint
      - devskim
      - osv-scanner-audit
      - osv-scanner
      - scorecard
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required to inspect this workflow run's code-scanning uploads.
      contents: read
      security-events: read # Required to read current code-scanning alerts.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Enforce zero added code scanning alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/security_delta_guard.py
          --event-name "$GITHUB_EVENT_NAME"
          --event-path "$GITHUB_EVENT_PATH"
          --ref "$GITHUB_REF"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --baseline-alert "Scorecard/BranchProtectionID"
          --baseline-alert "Scorecard/CIIBestPracticesID"
          --baseline-alert "Scorecard/CodeReviewID"
