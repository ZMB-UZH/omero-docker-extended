name: security-code-scanning

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: security-code-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@38697555549f1db7851b81482ff19f1fa5c4fedc # v4

      - name: Analyze
        uses: github/codeql-action/analyze@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          category: /language:${{ matrix.language }}

  trivy-filesystem:
    name: Trivy filesystem scan (SARIF)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit — list files in scan scope
        run: |
          echo "::group::Trivy filesystem scan scope"
          echo "Scanning lockfiles and config files for dependency vulnerabilities, misconfigs, and secrets."
          echo "--- Dependency manifests ---"
          find . -maxdepth 5 \( -name 'requirements*.txt' -o -name 'Pipfile.lock' \
            -o -name 'poetry.lock' -o -name 'package-lock.json' -o -name 'yarn.lock' \
            -o -name 'Gemfile.lock' -o -name 'go.sum' -o -name 'pom.xml' \) \
            -not -path './.git/*' | sort
          echo "--- Config files (misconfig scan) ---"
          find . -maxdepth 5 \( -name 'Dockerfile' -o -name '*.Dockerfile' \
            -o -name 'docker-compose*.yml' -o -name '*.yaml' -o -name '*.yml' \
            -o -name '*.tf' -o -name '*.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' | sort | head -100
          echo "::endgroup::"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit — list files in scan scope
        run: |
          echo "::group::Semgrep scan scope"
          echo "Scanning all source files for SAST findings."
          echo "--- Python files ---"
          find . -name '*.py' -not -path './.git/*' | wc -l
          find . -name '*.py' -not -path './.git/*' | sort
          echo "--- JavaScript/TypeScript files ---"
          find . \( -name '*.js' -o -name '*.ts' -o -name '*.jsx' -o -name '*.tsx' \) \
            -not -path './.git/*' -not -path './node_modules/*' | sort
          echo "--- HTML templates ---"
          find . -name '*.html' -not -path './.git/*' | sort
          echo "--- YAML/JSON config ---"
          find . \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' | sort | head -50
          echo "::endgroup::"

      - name: Run Semgrep scan
        run: semgrep scan --sarif --config auto . > semgrep-results.sarif

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        if: always()

  bandit:
    name: Bandit Python security scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python3 -m pip install --requirement .github/requirements/security-code-scanning.txt

      - name: Discover scan targets and test directories
        id: discover
        run: |
          # Auto-discover Python package directories at repo root (omero_*/omeroweb_* convention)
          # Only include real Python packages with __init__.py to avoid scanning data/runtime dirs.
          SCAN_DIRS=$(find . -maxdepth 1 -type d \( -name 'omero_*' -o -name 'omeroweb_*' \) \
            | while read -r dir; do
                if [ -f "$dir/__init__.py" ]; then
                  printf '%s\n' "${dir#./}"
                fi
              done | sort | tr '\n' ' ')
          SCAN_DIRS=$(echo "$SCAN_DIRS" | xargs)
          echo "scan_dirs=${SCAN_DIRS}" >> "$GITHUB_OUTPUT"

          # Auto-discover package test directories for exclusion from the production scan.
          PACKAGE_TEST_DIRS=""
          TEST_DIRS=""
          EXCLUDE_CSV=""
          if [ -n "$SCAN_DIRS" ]; then
            # shellcheck disable=SC2086
            PACKAGE_TEST_DIRS=$(find $SCAN_DIRS -type d \( -name 'tests' -o -name 'test' \) 2>/dev/null \
              | sort | tr '\n' ' ')
            PACKAGE_TEST_DIRS=$(echo "$PACKAGE_TEST_DIRS" | xargs)
            if [ -n "$PACKAGE_TEST_DIRS" ]; then
              EXCLUDE_CSV=$(echo "$PACKAGE_TEST_DIRS" | tr ' ' ',')
            fi
          fi
          TEST_DIRS="$PACKAGE_TEST_DIRS"
          if [ -d tests ]; then
            TEST_DIRS="$TEST_DIRS tests"
          fi
          TEST_DIRS=$(echo "$TEST_DIRS" | xargs)
          echo "test_dirs=${TEST_DIRS}" >> "$GITHUB_OUTPUT"
          echo "exclude_csv=${EXCLUDE_CSV}" >> "$GITHUB_OUTPUT"

          echo "Scan directories: ${SCAN_DIRS:-none}"
          echo "Package test directories: ${PACKAGE_TEST_DIRS:-none}"
          echo "All test directories: ${TEST_DIRS:-none}"
          echo "Exclude CSV for Bandit production scan: ${EXCLUDE_CSV:-none}"

      - name: Audit — list files in scan scope
        if: steps.discover.outputs.scan_dirs != ''
        run: |
          echo "::group::Bandit scan scope"
          echo "Scanning Python source files for security issues."
          echo "Discovered scan directories: ${{ steps.discover.outputs.scan_dirs }}"
          echo "Discovered test directories: ${{ steps.discover.outputs.test_dirs }}"
          echo "--- Production Python files ---"
          find ${{ steps.discover.outputs.scan_dirs }} \
            -name '*.py' -not -path '*/tests/*' -not -path '*/test/*' | sort
          echo "--- Test Python files ---"
          find ${{ steps.discover.outputs.scan_dirs }} \
            -name '*.py' \( -path '*/tests/*' -o -path '*/test/*' \) | sort
          echo "--- File counts ---"
          echo "Production: $(find ${{ steps.discover.outputs.scan_dirs }} \
            -name '*.py' -not -path '*/tests/*' -not -path '*/test/*' | wc -l)"
          echo "Test: $(find ${{ steps.discover.outputs.scan_dirs }} \
            -name '*.py' \( -path '*/tests/*' -o -path '*/test/*' \) | wc -l)"
          if [ -d tests ]; then
            echo "Top-level test: $(find tests -name '*.py' | wc -l)"
          fi
          echo "::endgroup::"

      - name: Run Bandit scan (production code — excludes test directories)
        if: steps.discover.outputs.scan_dirs != ''
        run: |
          EXCLUDE_ARG=""
          if [ -n "${{ steps.discover.outputs.exclude_csv }}" ]; then
            EXCLUDE_ARG="--exclude ${{ steps.discover.outputs.exclude_csv }}"
          fi
          # shellcheck disable=SC2086
          bandit -r \
            ${{ steps.discover.outputs.scan_dirs }} \
            $EXCLUDE_ARG \
            --skip B603,B404 \
            -f sarif \
            -o bandit-prod.sarif \
            --exit-zero

      - name: Run Bandit scan (test code — skips assert and test-credential rules)
        if: steps.discover.outputs.test_dirs != ''
        run: >-
          bandit -r
          ${{ steps.discover.outputs.test_dirs }}
          --skip B101,B106,B603,B404
          -f sarif
          -o bandit-test.sarif
          --exit-zero

      - name: Build legacy Bandit cleanup SARIF
        if: always() && (steps.discover.outputs.scan_dirs != '' || steps.discover.outputs.test_dirs != '')
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          template_path = None
          for path in ("bandit-prod.sarif", "bandit-test.sarif"):
              if os.path.exists(path) and os.path.getsize(path) > 0:
                  template_path = path
                  break

          if template_path is None:
              sys.exit("No Bandit SARIF template was generated.")

          with open(template_path, encoding="utf-8") as handle:
              data = json.load(handle)

          runs = data.get("runs", [])
          if not runs:
              sys.exit("Bandit SARIF template contained no runs.")

          run = runs[0]
          run["results"] = []
          if "artifacts" in run:
              run["artifacts"] = []
          if "invocations" in run:
              run["invocations"] = []

          driver = run.get("tool", {}).get("driver", {})
          if "rules" in driver:
              driver["rules"] = []
          if run.get("tool", {}).get("extensions"):
              run["tool"]["extensions"] = []

          data["runs"] = [run]

          with open("bandit-legacy-cleanup.sarif", "w", encoding="utf-8") as handle:
              json.dump(data, handle)
          PY

      - name: Upload Bandit production results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: bandit-prod.sarif
          category: bandit-prod
        if: always() && steps.discover.outputs.scan_dirs != ''

      - name: Upload Bandit test results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: bandit-test.sarif
          category: bandit-test
        if: always() && steps.discover.outputs.test_dirs != ''

      - name: Upload Bandit legacy cleanup results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: bandit-legacy-cleanup.sarif
          # Keep the legacy category alive with zero results so stale pre-split alerts can close.
          category: bandit
        if: always() && (steps.discover.outputs.scan_dirs != '' || steps.discover.outputs.test_dirs != '')

  hadolint-discover:
    name: Discover Dockerfiles
    runs-on: ubuntu-24.04
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: docker

      - name: Find all Dockerfiles
        id: find
        run: |
          FILES=$(find docker -name '*.Dockerfile' -type f | sort | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "dockerfiles=${FILES}" >> "$GITHUB_OUTPUT"
          echo "Discovered Dockerfiles: ${FILES}"

  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    needs: hadolint-discover
    if: needs.hadolint-discover.outputs.dockerfiles != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.hadolint-discover.outputs.dockerfiles) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit — show file being scanned
        run: |
          echo "::group::Hadolint scan scope"
          echo "Scanning Dockerfile: ${{ matrix.dockerfile }}"
          wc -l "${{ matrix.dockerfile }}"
          echo "::endgroup::"

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-${{ matrix.dockerfile }}
        if: always()

  devskim:
    name: DevSkim security lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit — list files in scan scope
        run: |
          echo "::group::DevSkim scan scope"
          echo "Scanning all source files for security anti-patterns."
          echo "Excluded globs: **/.git/**, **/pgdata/**, **/omero_data/**, **/omero_temp/**"
          echo "Excluded rules: DS162092 (localhost references in container infrastructure)"
          echo "--- All scannable files ---"
          find . -type f \( -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.html' \
            -o -name '*.yml' -o -name '*.yaml' -o -name '*.json' -o -name '*.sh' \
            -o -name '*.sql' -o -name '*.xml' -o -name 'Dockerfile' -o -name '*.Dockerfile' \) \
            -not -path './.git/*' -not -path '*/pgdata/*' \
            -not -path '*/omero_data/*' -not -path '*/omero_temp/*' | sort
          echo "Total: $(find . -type f \( -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.html' \
            -o -name '*.yml' -o -name '*.yaml' -o -name '*.json' -o -name '*.sh' \
            -o -name '*.sql' -o -name '*.xml' -o -name 'Dockerfile' -o -name '*.Dockerfile' \) \
            -not -path './.git/*' -not -path '*/pgdata/*' \
            -not -path '*/omero_data/*' -not -path '*/omero_temp/*' | wc -l) files"
          echo "::endgroup::"

      - name: Run DevSkim scan
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1
        with:
          directory-to-scan: .
          ignore-globs: "**/.git/**,**/pgdata/**,**/omero_data/**,**/omero_temp/**"
          exclude-rules: DS162092

      - name: Upload DevSkim results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: devskim-results.sarif
          category: devskim
        if: always()

  osv-scanner-audit:
    name: OSV scan scope audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit — list dependency manifests for OSV scan
        run: |
          echo "::group::OSV-Scanner scan scope"
          echo "OSV-Scanner recursively scans dependency manifests for known vulnerabilities."
          echo "--- Dependency manifests found ---"
          find . -maxdepth 5 \( -name 'requirements*.txt' -o -name 'Pipfile' \
            -o -name 'Pipfile.lock' -o -name 'poetry.lock' -o -name 'pyproject.toml' \
            -o -name 'setup.py' -o -name 'setup.cfg' \
            -o -name 'package.json' -o -name 'package-lock.json' -o -name 'yarn.lock' \
            -o -name 'pnpm-lock.yaml' -o -name 'go.sum' -o -name 'go.mod' \
            -o -name 'Gemfile.lock' -o -name 'pom.xml' -o -name 'gradle.lockfile' \) \
            -not -path './.git/*' -not -path './node_modules/*' | sort
          echo "::endgroup::"

  osv-scanner:
    name: OSV dependency vulnerability scan
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@98b584ee2ed2da3935ccce10e06739d54cdcd20b # v2.0.0
    with:
      scan-args: |-
        --recursive
        ./

  scorecard:
    name: OSSF Scorecard supply-chain security
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Audit — describe scan scope
        run: |
          echo "::group::OSSF Scorecard scan scope"
          echo "Scorecard evaluates repository-level supply-chain security practices."
          echo "It checks: branch protection, CI/CD config, dependency management,"
          echo "code review, contributors, vulnerability disclosure, and more."
          echo "This is a repository-level assessment, not a per-file scan."
          echo "::endgroup::"

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        continue-on-error: true
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
        if: always()
