name: super-linter

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Super-Linter
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # Required to pull the pinned Super-Linter container from GHCR.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-Linter
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FILTER_REGEX_EXCLUDE: (^|/)third_party/(ecc-v1\.10\.0|caveman-v1\.6\.0)/
          LINTER_RULES_PATH: .
          MARKDOWN_CONFIG_FILE: .markdownlint.yaml
          RUN_LOCAL: 'true'
          YAML_CONFIG_FILE: .yamllint
          VALIDATE_ALL_CODEBASE: 'true'
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: 'true'
          VALIDATE_GITHUB_ACTIONS: 'true'
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: 'true'
          VALIDATE_MARKDOWN: 'true'
          VALIDATE_YAML: 'true'
        run: |
          docker run --rm \
            --workdir "${GITHUB_WORKSPACE}" \
            -e DEFAULT_BRANCH \
            -e DEFAULT_WORKSPACE="${GITHUB_WORKSPACE}" \
            -e FILTER_REGEX_EXCLUDE \
            -e LINTER_RULES_PATH \
            -e MARKDOWN_CONFIG_FILE \
            -e RUN_LOCAL \
            -e YAML_CONFIG_FILE \
            -e VALIDATE_ALL_CODEBASE \
            -e VALIDATE_GIT_MERGE_CONFLICT_MARKERS \
            -e VALIDATE_GITHUB_ACTIONS \
            -e VALIDATE_GITHUB_ACTIONS_ZIZMOR \
            -e VALIDATE_MARKDOWN \
            -e VALIDATE_YAML \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            ghcr.io/super-linter/super-linter:v8.6.0@sha256:35955a2af8395c8224c7072732b91350f7f02c2ae9ee751842776ef29092a6cc
