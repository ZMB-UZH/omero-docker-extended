name: release-prebuilt-carrier

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "SemVer release and docker image tag. Leave empty to bump the main-channel tag from existing tags or start 1.0.0-main.1."
        required: false
        type: string
      docker_repository:
        description: "docker hub repository for the single carrier image."
        required: false
        default: "strmt7/omero-docker-extended"
        type: string
      replace_existing:
        description: "Replace an existing GitHub release/tag and docker hub image tag for the requested version."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release prebuilt carrier
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_DOCKER_REPOSITORY: strmt7/omero-docker-extended
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve release metadata
        id: release-metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
          REQUESTED_DOCKER_REPOSITORY: ${{ inputs.docker_repository }}
          REQUESTED_REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" \
            --jq '.[].name' \
            | sort -u > dist/existing-release-tags.txt
          python3 tools/prebuilt_release_metadata.py \
            --requested-version "${REQUESTED_RELEASE_VERSION}" \
            --requested-docker-repository "${REQUESTED_DOCKER_REPOSITORY}" \
            --default-docker-repository "${DEFAULT_DOCKER_REPOSITORY}" \
            --existing-tags-file dist/existing-release-tags.txt \
            --repo-root "${GITHUB_WORKSPACE}"
          metadata_value() {
            grep -E "^${1}=" "${GITHUB_ENV}" | tail -n 1 | cut -d= -f2-
          }
          {
            printf 'release_version=%s\n' "$(metadata_value RELEASE_VERSION)"
            printf 'docker_repository=%s\n' "$(metadata_value DOCKER_REPOSITORY)"
            printf 'carrier_image=%s\n' "$(metadata_value CARRIER_IMAGE)"
          } >> "${GITHUB_OUTPUT}"
          case "${REQUESTED_REPLACE_EXISTING}" in
            true|True|1)
              [ -n "${REQUESTED_RELEASE_VERSION}" ] || {
                echo "replace_existing requires an explicit release_version." >&2
                exit 1
              }
              echo "RELEASE_REPLACE_EXISTING=1" >> "${GITHUB_ENV}"
              ;;
            false|False|0|"")
              echo "RELEASE_REPLACE_EXISTING=0" >> "${GITHUB_ENV}"
              ;;
            *)
              echo "Invalid replace_existing value: ${REQUESTED_REPLACE_EXISTING}" >&2
              exit 1
              ;;
          esac

      - name: Report runner storage before build
        run: |
          set -euo pipefail
          df -h /
          docker system df

      - name: Move docker data root to hosted-runner large disk
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          target_root="/mnt/docker-data"
          [ -d /mnt ] || { echo "Hosted runner large disk /mnt is not available." >&2; exit 1; }
          current_root="$(docker info -f '{{.DockerRootDir}}')"
          if [ "${current_root}" != "${target_root}" ]; then
            sudo mkdir -p "${target_root}"
            sudo systemctl stop docker
            sudo env DOCKER_DATA_ROOT="${target_root}" python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          daemon_config = Path("/etc/docker/daemon.json")
          if daemon_config.exists() and daemon_config.read_text(encoding="utf-8").strip():
              data = json.loads(daemon_config.read_text(encoding="utf-8"))
          else:
              data = {}
          data["data-root"] = os.environ["DOCKER_DATA_ROOT"]
          daemon_config.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            sudo systemctl start docker
          fi
          actual_root="$(docker info -f '{{.DockerRootDir}}')"
          [ "${actual_root}" = "${target_root}" ] || {
            echo "Docker data root is ${actual_root}, expected ${target_root}." >&2
            exit 1
          }
          df -h / /mnt "${actual_root}"
          docker system df

      - name: Refuse existing release or image tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            release_tag_exists=1
          else
            release_tag_exists=0
          fi
          if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            github_release_exists=1
          else
            github_release_exists=0
          fi
          status="$(
            python3 - <<'PY'
          from __future__ import annotations

          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["DOCKER_REPOSITORY"]
          tag = urllib.parse.quote(os.environ["RELEASE_VERSION"], safe="")
          url = f"https://hub.docker.com/v2/repositories/{repository}/tags/{tag}/"
          request = urllib.request.Request(url, headers={"Accept": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(response.status)
          except urllib.error.HTTPError as exc:
              print(exc.code)
          except urllib.error.URLError as exc:
              print(f"ERROR:{exc.reason}")
          PY
          )"
          if [ "${RELEASE_REPLACE_EXISTING:-0}" = "1" ]; then
            case "${status}" in
              200|404) ;;
              *)
                echo "Could not verify docker hub tag state for ${CARRIER_IMAGE}: ${status}" >&2
                exit 1
                ;;
            esac
            if [ "${release_tag_exists}" = "0" ] \
              && [ "${github_release_exists}" = "0" ] \
              && [ "${status}" = "404" ]; then
              echo "Replacement requested but no existing release artifact was found for ${RELEASE_VERSION}." >&2
              exit 1
            fi
            printf 'Replacement state: github_tag=%s github_release=%s docker_tag_http=%s\n' \
              "${release_tag_exists}" "${github_release_exists}" "${status}"
            exit 0
          fi
          if [ "${release_tag_exists}" = "1" ]; then
            echo "Release tag already exists: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          if [ "${github_release_exists}" = "1" ]; then
            echo "GitHub release already exists: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          case "${status}" in
            404) ;;
            200)
              echo "docker hub image tag already exists: ${CARRIER_IMAGE}" >&2
              exit 1
              ;;
            *)
              echo "Could not verify docker hub tag state for ${CARRIER_IMAGE}: ${status}" >&2
              exit 1
              ;;
          esac

      - name: Create source archive
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="omero-docker-extended-${RELEASE_VERSION}/" \
            HEAD \
            -o "dist/omero-docker-extended-${RELEASE_VERSION}-source.tar.gz"
          sha256sum "dist/omero-docker-extended-${RELEASE_VERSION}-source.tar.gz" \
            > "dist/omero-docker-extended-${RELEASE_VERSION}-source.tar.gz.sha256"

      - name: Prepare synthetic CI environment files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          from tools.env_safety_guard import resolve_env_references

          root = Path.cwd()
          copied = [
              (root / ".env_example", root / ".env"),
              (root / "installation_paths_example.env", root / "installation_paths.env"),
          ]
          copied.extend(
              (path, path.with_name(path.name.replace("_example.env", ".env")))
              for path in sorted((root / "env").glob("*_example.env"))
          )

          env_values: dict[str, str] = {}
          key_pattern = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")
          for source, target in copied:
              if not source.is_file():
                  raise SystemExit(f"Missing environment contract: {source}")
              shutil.copyfile(source, target)
              for line in target.read_text(encoding="utf-8").splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  key = key.strip()
                  if not key_pattern.fullmatch(key):
                      raise SystemExit(f"Invalid environment key in {target}: {key}")
                  env_values[key] = value

          env_values["OMERO_INSTALLATION_PATH"] = str(root)
          for key, value in list(env_values.items()):
              try:
                  env_values[key] = resolve_env_references(value, env_values)
              except ValueError as exc:
                  raise SystemExit(
                      f"Unsafe synthetic environment value for {key}: {exc}"
                  ) from exc
          discovered_profiles = subprocess.check_output(
              ["docker", "compose", "-f", "docker-compose.yml", "config", "--profiles"],
              env={**os.environ, **env_values},
              text=True,
          ).splitlines()
          env_values["COMPOSE_PROFILES"] = ",".join(
              profile.strip() for profile in discovered_profiles if profile.strip()
          )
          if not env_values["COMPOSE_PROFILES"]:
              raise SystemExit("No Compose profiles discovered for release build.")
          unresolved = {
              key: value for key, value in env_values.items() if "${" in value
          }
          if unresolved:
              names = ", ".join(sorted(unresolved))
              raise SystemExit(f"Unresolved synthetic environment reference(s): {names}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in sorted(env_values.items()):
                  marker = f"OMERO_ENV_{key}"
                  env_file.write(f"{key}<<{marker}\n{value}\n{marker}\n")

          print(f"Prepared {len(copied)} synthetic CI environment file(s).")
          PY

      - name: Authenticate to docker hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
        run: |
          set -euo pipefail
          [ -n "${DOCKERHUB_USERNAME}" ] || { echo "DOCKERHUB_USERNAME secret is required." >&2; exit 1; }
          [ -n "${DOCKERHUB_TOKEN}" ] || { echo "DOCKERHUB_TOKEN secret is required." >&2; exit 1; }
          printf '%s' "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Install Docker Scout CLI
        env:
          DOCKER_SCOUT_CLI_VERSION: "1.23.1"
          DOCKER_SCOUT_CLI_SHA256: 0f778f9d833f28bc6cccff95e33039849c0afcecafa38d9f46fe74bfd0915714
        run: |
          set -euo pipefail
          archive="docker-scout_${DOCKER_SCOUT_CLI_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL \
            "https://github.com/docker/scout-cli/releases/download/v${DOCKER_SCOUT_CLI_VERSION}/${archive}" \
            -o "${archive_path}"
          printf '%s  %s\n' "${DOCKER_SCOUT_CLI_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir -p "${HOME}/.docker/cli-plugins"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" docker-scout
          install -m 0755 "${RUNNER_TEMP}/docker-scout" "${HOME}/.docker/cli-plugins/docker-scout"
          docker scout version

      - name: Ensure Docker Scout repository analysis is enabled
        env:
          DOCKER_SCOUT_ORG: strmt7
        run: |
          set -euo pipefail
          docker scout version
          list_enabled_repositories() {
            docker scout repo list \
              --org "${DOCKER_SCOUT_ORG}" \
              --only-enabled \
              --filter "${DOCKER_REPOSITORY}"
          }
          enabled_repositories="$(list_enabled_repositories)"
          printf '%s\n' "${enabled_repositories}"
          if printf '%s\n' "${enabled_repositories}" | grep -F "${DOCKER_REPOSITORY}"; then
            echo "Docker Scout repository analysis is already enabled for ${DOCKER_REPOSITORY}."
            exit 0
          fi
          repo_enable_log="${RUNNER_TEMP}/docker-scout-repo-enable.log"
          if docker scout repo enable "${DOCKER_REPOSITORY}" --org "${DOCKER_SCOUT_ORG}" >"${repo_enable_log}" 2>&1; then
            cat "${repo_enable_log}"
          else
            enable_status="$?"
            cat "${repo_enable_log}" >&2
            if grep -F "reached the repository limit for your plan" "${repo_enable_log}" >/dev/null; then
              echo "Docker Scout repository analysis cannot be enabled because the Docker organization reached its Scout repository limit." >&2
              echo "Disable Scout on another Docker Hub repository or upgrade the Docker Hub plan, then rerun this release workflow." >&2
            fi
            exit "${enable_status}"
          fi
          enabled_repositories="$(list_enabled_repositories)"
          printf '%s\n' "${enabled_repositories}"
          printf '%s\n' "${enabled_repositories}" | grep -F "${DOCKER_REPOSITORY}"

      - name: Build hardened flattened runtime images
        run: |
          set -euo pipefail
          COMPOSE_FILE="${GITHUB_WORKSPACE}/docker-compose.yml" \
          COMPOSE_PROFILES="${COMPOSE_PROFILES:?}" \
          DOCKER_BUILD_PUSH_IMAGES="0" \
          DOCKER_BUILD_INLINE_CACHE="1" \
          DOCKER_BUILD_NO_CACHE="0" \
          DOCKER_BUILD_PROVENANCE="0" \
          DOCKER_BUILD_LOCAL_CACHE_ENABLED="0" \
          DOCKER_BUILD_BAKE_SERIAL_MODE="always" \
          DOCKER_BUILD_FLATTEN_FINAL_IMAGE="1" \
          APPLY_SECURITY_HARDENING="1" \
          DOCKER_BUILD_PROGRESS="plain" \
          installation/docker_buildx_compressed_push.sh

      - name: Save runtime image bundle
        run: |
          set -euo pipefail
          mapfile -t compose_images < <(
            COMPOSE_PROFILES="${COMPOSE_PROFILES:?}" docker compose -f docker-compose.yml config --images | sort -u
          )
          [ "${#compose_images[@]}" -gt 0 ] || { echo "No Compose images were discovered." >&2; exit 1; }
          printf '%s\n' "${compose_images[@]}" > dist/prebuilt-required-images.txt
          python3 tools/prune_non_required_docker_images.py \
            --required-images-file dist/prebuilt-required-images.txt \
            --execute
          df -h /
          docker system df
          for image_ref in "${compose_images[@]}"; do
            case "${image_ref}" in
              ""|latest|*:latest|*:latest@*)
                echo "Invalid floating image reference: ${image_ref}" >&2
                exit 1
                ;;
            esac
            if ! docker image inspect "${image_ref}" >/dev/null 2>&1; then
              docker pull "${image_ref}"
            fi
          done
          write_runtime_archive() {
            docker save "${compose_images[@]}" \
              | python3 tools/write_prebuilt_runtime_archive.py \
                  --archive dist/runtime-images.tar.gz \
                  --raw-bytes-file dist/runtime-images-uncompressed.bytes
          }
          archive_written=0
          for attempt in 1 2 3; do
            if write_runtime_archive; then
              archive_written=1
              break
            fi
            rm -f dist/runtime-images.tar.gz dist/runtime-images-uncompressed.bytes
            echo "docker save failed on attempt ${attempt}; collecting storage diagnostics." >&2
            df -h /
            docker system df
            if [ "${attempt}" = "3" ]; then
              break
            fi
            sleep "$((attempt * 15))"
          done
          [ "${archive_written}" = "1" ] || {
            echo "docker save failed after 3 attempts." >&2
            exit 1
          }
          test -s dist/runtime-images-uncompressed.bytes
          df -h /
          docker system df

      - name: Write prebuilt manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          bundle = dist / "runtime-images.tar.gz"
          raw_bytes_path = dist / "runtime-images-uncompressed.bytes"
          raw_bytes = int(raw_bytes_path.read_text(encoding="utf-8").strip())
          digest = hashlib.sha256()
          with bundle.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)

          required_images = [
              line.strip()
              for line in (dist / "prebuilt-required-images.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          manifest = {
              "schema_version": 1,
              "release": os.environ["RELEASE_VERSION"],
              "git_sha": os.environ["GITHUB_SHA"],
              "carrier_image": os.environ["CARRIER_IMAGE"],
              "carrier_image_repository": os.environ["DOCKER_REPOSITORY"],
              "required_images": required_images,
              "runtime_images_archive": "runtime-images.tar.gz",
              "image_archive_sha256": digest.hexdigest(),
              "runtime_images_archive_bytes": bundle.stat().st_size,
              "runtime_images_uncompressed_bytes": raw_bytes,
          }
          (dist / "prebuilt-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub draft release
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_REPLACE_EXISTING:-0}" = "1" ]; then
            if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release delete "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --yes
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_VERSION}" \
                >/dev/null
            fi
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["DOCKER_REPOSITORY"]
          tag = urllib.parse.quote(os.environ["RELEASE_VERSION"], safe="")
          tag_url = f"https://hub.docker.com/v2/repositories/{repository}/tags/{tag}/"

          def request_status(request: urllib.request.Request) -> int:
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status
              except urllib.error.HTTPError as exc:
                  return exc.code

          current_status = request_status(
              urllib.request.Request(tag_url, headers={"Accept": "application/json"})
          )
          if current_status == 200:
              login_data = json.dumps(
                  {
                      "identifier": os.environ["DOCKERHUB_USERNAME"],
                      "secret": os.environ["DOCKERHUB_TOKEN"],
                  }
              ).encode("utf-8")
              login_request = urllib.request.Request(
                  "https://hub.docker.com/v2/auth/token",
                  data=login_data,
                  headers={"Accept": "application/json", "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(login_request, timeout=30) as response:
                  login_response = json.load(response)
              access_token = login_response.get("access_token") or login_response.get("token")
              if not access_token:
                  raise SystemExit("Docker Hub login did not return an access token.")
              delete_status = request_status(
                  urllib.request.Request(
                      tag_url,
                      headers={"Authorization": f"Bearer {access_token}"},
                      method="DELETE",
                  )
              )
              if delete_status not in {202, 204}:
                  raise SystemExit(
                      f"Docker Hub tag deletion returned HTTP {delete_status}, expected 202 or 204."
                  )
          elif current_status != 404:
              raise SystemExit(
                  f"Docker Hub tag lookup returned HTTP {current_status}, expected 200 or 404."
              )

          for attempt in range(1, 11):
              status = request_status(
                  urllib.request.Request(tag_url, headers={"Accept": "application/json"})
              )
              if status == 404:
                  break
              if status != 200:
                  raise SystemExit(
                      f"Docker Hub tag verification returned HTTP {status}, expected 200 or 404."
                  )
              if attempt == 10:
                  raise SystemExit("Docker Hub tag remained visible after deletion.")
              time.sleep(attempt)
          print("Existing GitHub and Docker Hub release artifacts are absent.")
          PY
            if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "GitHub release remained visible after deletion: ${RELEASE_VERSION}" >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
              echo "GitHub tag remained visible after deletion: ${RELEASE_VERSION}" >&2
              exit 1
            fi
          fi
          target_ref_type="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_TARGET_REF}" \
              --jq '.object.type'
          )"
          target_ref_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_TARGET_REF}" \
              --jq '.object.sha'
          )"
          [ "${target_ref_type}" = "commit" ] || {
            echo "Release target ref ${RELEASE_TARGET_REF} is ${target_ref_type}, expected commit." >&2
            exit 1
          }
          [ -n "${target_ref_sha}" ] || { echo "Release target ref is missing: ${RELEASE_TARGET_REF}" >&2; exit 1; }
          if [ "${target_ref_sha}" != "${GITHUB_SHA}" ]; then
            echo "Release target ref ${RELEASE_TARGET_REF} moved from ${GITHUB_SHA} to ${target_ref_sha}." >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_VERSION}" \
            -f "sha=${GITHUB_SHA}" \
            >/dev/null
          echo "RELEASE_TAG_CREATED_BY_RUN=1" >> "${GITHUB_ENV}"
          created_tag_type="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
              --jq '.object.type'
          )"
          created_tag_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
              --jq '.object.sha'
          )"
          [ "${created_tag_type}" = "commit" ] || {
            echo "Created release tag ${RELEASE_VERSION} is ${created_tag_type}, expected commit." >&2
            exit 1
          }
          [ "${created_tag_sha}" = "${GITHUB_SHA}" ] || {
            echo "Created release tag ${RELEASE_VERSION} points to ${created_tag_sha}, expected ${GITHUB_SHA}." >&2
            exit 1
          }
          cat > dist/release-notes.md <<EOF
          Prebuilt carrier image:

          ${CARRIER_IMAGE}

          This release contains the source archive and the single docker carrier image manifest.
          EOF
          create_draft_release() {
            gh release create "${RELEASE_VERSION}" \
              "dist/omero-docker-extended-${RELEASE_VERSION}-source.tar.gz" \
              "dist/omero-docker-extended-${RELEASE_VERSION}-source.tar.gz.sha256" \
              "dist/prebuilt-manifest.json" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_TARGET_REF}" \
              --title "${RELEASE_VERSION}" \
              --notes-file dist/release-notes.md \
              --draft \
              --verify-tag \
              --latest=false
          }
          release_created=0
          for attempt in 1 2 3 4 5; do
            if create_draft_release; then
              release_created=1
              break
            fi
            create_status="$?"
            if [ "${attempt}" = "5" ]; then
              exit "${create_status}"
            fi
            echo "GitHub draft release creation failed on attempt ${attempt}; retrying after a short consistency delay." >&2
            sleep "$((attempt * 5))"
          done
          [ "${release_created}" = "1" ] || {
            echo "GitHub draft release creation did not complete." >&2
            exit 1
          }
          echo "RELEASE_DRAFT_CREATED_BY_RUN=1" >> "${GITHUB_ENV}"

      - name: Set up carrier Buildx builder
        run: |
          set -euo pipefail
          BUILDX_BUILDER_NAME="release-carrier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx rm -f "${BUILDX_BUILDER_NAME}" >/dev/null 2>&1 || true
          docker buildx create \
            --name "${BUILDX_BUILDER_NAME}" \
            --driver docker-container \
            --use \
            --bootstrap
          echo "BUILDX_BUILDER=${BUILDX_BUILDER_NAME}" >> "${GITHUB_ENV}"

      - name: Build and push single carrier image
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "${BUILDX_BUILDER:?}" \
            --push \
            --provenance=true \
            --sbom=true \
            --progress plain \
            -f docker/prebuilt-carrier.Dockerfile \
            -t "${CARRIER_IMAGE}" \
            dist
          df -h /
          docker system df

      - name: Verify carrier image contents
        run: |
          set -euo pipefail
          docker pull "${CARRIER_IMAGE}"
          carrier_repo_digest="$(
            docker image inspect "${CARRIER_IMAGE}" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | awk '/@sha256:[0-9a-f]{64}$/ { print; exit }'
          )"
          [ -n "${carrier_repo_digest}" ] || {
            echo "Carrier image is missing a sha256 repo digest after pull: ${CARRIER_IMAGE}" >&2
            exit 1
          }
          carrier_digest="${carrier_repo_digest##*@}"
          case "${carrier_digest}" in
            sha256:????????????????????????????????????????????????????????????????)
              ;;
            *)
              echo "Carrier image digest has an unexpected format: ${carrier_digest}" >&2
              exit 1
              ;;
          esac
          cat > dist/prebuilt-carrier-digest.txt <<EOF
          PREBUILT_IMAGE_REPOSITORY=${DOCKER_REPOSITORY}
          PREBUILT_IMAGE_RELEASE=${RELEASE_VERSION}
          PREBUILT_IMAGE_DIGEST=${carrier_digest}
          PREBUILT_IMAGE_REF=${CARRIER_IMAGE}@${carrier_digest}
          CARRIER_IMAGE=${CARRIER_IMAGE}
          GITHUB_SHA=${GITHUB_SHA}
          EOF
          cat > dist/release-notes.md <<EOF
          Prebuilt carrier image:

          ${CARRIER_IMAGE}

          Expected carrier digest:

          ${carrier_digest}

          This release contains the source archive, the single docker carrier image manifest,
          and prebuilt-carrier-digest.txt for digest-pinned easy installs.
          EOF
          cid="$(docker create "${CARRIER_IMAGE}")"
          cleanup_verify_container() {
            docker rm -f "${cid}" >/dev/null 2>&1 || true
          }
          trap cleanup_verify_container EXIT
          docker cp "${cid}:/omero-prebuilt/prebuilt-manifest.json" dist/verified-prebuilt-manifest.json
          docker cp "${cid}:/omero-prebuilt/prebuilt-required-images.txt" dist/verified-prebuilt-required-images.txt
          cleanup_verify_container
          trap - EXIT
          cmp dist/prebuilt-manifest.json dist/verified-prebuilt-manifest.json
          cmp dist/prebuilt-required-images.txt dist/verified-prebuilt-required-images.txt

      - name: Upload carrier digest release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/prebuilt-carrier-digest.txt
          gh release upload "${RELEASE_VERSION}" \
            "dist/prebuilt-carrier-digest.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Upload carrier analysis to Docker Scout
        env:
          DOCKER_SCOUT_ORG: strmt7
        run: |
          set -euo pipefail
          docker scout push \
            --org "${DOCKER_SCOUT_ORG}" \
            --sbom \
            "${CARRIER_IMAGE}"

      - name: Analyze Docker Hub carrier image with Docker Scout
        uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
        with:
          command: quickview,cves
          image: registry://${{ steps.release-metadata.outputs.carrier_image }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          organization: strmt7
          output: dist/docker-scout-sbom.json
          write-comment: false
          summary: true
          exit-code: false

      - name: Export Docker Scout carrier SBOM
        uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
        with:
          command: sbom
          image: registry://${{ steps.release-metadata.outputs.carrier_image }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env] GitHub Actions environments create deployment records.
          output: dist/docker-scout-sbom.json
          write-comment: false
          summary: true

      - name: Verify Docker Scout release scan output
        run: |
          set -euo pipefail
          test -s dist/docker-scout-sbom.json
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          sbom = json.loads(Path("dist/docker-scout-sbom.json").read_text(encoding="utf-8"))
          if not isinstance(sbom, dict):
              raise SystemExit("Docker Scout SBOM output is not a JSON object.")
          if not sbom:
              raise SystemExit("Docker Scout SBOM output is empty.")
          print("Docker Scout SBOM output verified.")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f dist/release-notes.md ]; then
            cat > dist/release-notes.md <<EOF
          Prebuilt carrier image:

          ${CARRIER_IMAGE}

          This release contains the source archive and the single docker carrier image manifest.
          EOF
          fi
          if [ "${RELEASE_REPLACE_EXISTING:-0}" = "1" ]; then
            target_ref_type="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_TARGET_REF}" \
                --jq '.object.type'
            )"
            target_ref_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_TARGET_REF}" \
                --jq '.object.sha'
            )"
            [ "${target_ref_type}" = "commit" ] || {
              echo "Release target ref ${RELEASE_TARGET_REF} is ${target_ref_type}, expected commit." >&2
              exit 1
            }
            [ "${target_ref_sha}" = "${GITHUB_SHA}" ] || {
              echo "Release target ref ${RELEASE_TARGET_REF} moved from ${GITHUB_SHA} to ${target_ref_sha}." >&2
              exit 1
            }
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_VERSION}" \
              -f "sha=${GITHUB_SHA}" \
              -F "force=true" \
              >/dev/null
            gh release upload "${RELEASE_VERSION}" \
              "dist/omero-docker-extended-${RELEASE_VERSION}-source.tar.gz" \
              "dist/omero-docker-extended-${RELEASE_VERSION}-source.tar.gz.sha256" \
              "dist/prebuilt-manifest.json" \
              "dist/prebuilt-carrier-digest.txt" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_TARGET_REF}" \
              --title "${RELEASE_VERSION}" \
              --notes-file dist/release-notes.md \
              --draft=false \
              --latest=false \
              --verify-tag
          else
            gh release edit "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file dist/release-notes.md \
              --draft=false \
              --latest=false
          fi
          created_tag_type="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
              --jq '.object.type'
          )"
          created_tag_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
              --jq '.object.sha'
          )"
          if [ "${created_tag_type}" = "tag" ]; then
            created_tag_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${created_tag_sha}" \
                --jq '.object.sha'
            )"
          elif [ "${created_tag_type}" != "commit" ]; then
            echo "Created release tag ${RELEASE_VERSION} is ${created_tag_type}, expected commit or tag." >&2
            exit 1
          fi
          [ "${created_tag_sha}" = "${GITHUB_SHA}" ] || {
            echo "Created release tag ${RELEASE_VERSION} points to ${created_tag_sha}, expected ${GITHUB_SHA}." >&2
            exit 1
          }
          gh release view "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets,url \
            > dist/github-release-verified.json
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          release = json.loads(Path("dist/github-release-verified.json").read_text())
          expected_assets = {
              f"omero-docker-extended-{os.environ['RELEASE_VERSION']}-source.tar.gz",
              f"omero-docker-extended-{os.environ['RELEASE_VERSION']}-source.tar.gz.sha256",
              "prebuilt-manifest.json",
              "prebuilt-carrier-digest.txt",
          }
          actual_assets = {asset["name"] for asset in release.get("assets", [])}
          errors = []
          if release.get("tagName") != os.environ["RELEASE_VERSION"]:
              errors.append("tag name mismatch")
          if release.get("targetCommitish") != os.environ["RELEASE_TARGET_REF"]:
              errors.append("target ref mismatch")
          if release.get("isDraft"):
              errors.append("release is still a draft")
          if release.get("isPrerelease"):
              errors.append("release is marked as a prerelease")
          missing_assets = sorted(expected_assets - actual_assets)
          if missing_assets:
              errors.append(f"missing release asset(s): {', '.join(missing_assets)}")
          if errors:
              raise SystemExit("; ".join(errors))
          print(f"Published GitHub release {release['url']}")
          PY

      - name: Delete draft GitHub release after failed carrier publish
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_VERSION:-}" ]; then
            exit 0
          fi
          if [ "${RELEASE_DRAFT_CREATED_BY_RUN:-0}" = "1" ] || [ "${RELEASE_TAG_CREATED_BY_RUN:-0}" = "1" ]; then
            release_is_draft="$(
              gh release view "${RELEASE_VERSION}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json isDraft \
                --jq '.isDraft' 2>/dev/null || true
            )"
            if [ "${release_is_draft}" = "true" ]; then
              gh release delete "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
            fi
          fi
          if [ "${RELEASE_TAG_CREATED_BY_RUN:-0}" = "1" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1 || true
            fi
          fi

      - name: Remove carrier Buildx builder
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${BUILDX_BUILDER:-}" ]; then
            docker buildx rm -f "${BUILDX_BUILDER}" >/dev/null 2>&1 || true
          fi
