version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:45"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:50"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Held until upstream provides a stable ome-zarr-models release compatible
      # with the Python 3.14 CI resolver. ome-zarr 0.18.0 currently resolves to
      # ome-zarr-models 1.8.0rc0 under Python 3.14.
      - dependency-name: "ome-zarr"
    commit-message:
      prefix: "deps(ci-pip)"

  - package-ecosystem: "pip"
    directory: "/omeroweb_omp_plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(pip)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(compose)"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps(docker)"
