version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:45"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Actions 3.4.0/3.5.0 embed Hadolint 2.15.0/2.15.1. Upstream issues
      # hadolint/hadolint#1241 and #1252 reproduce ENV/ARG resetting its Bash
      # detection. Keep future versions eligible for compatibility review.
      - dependency-name: "hadolint/hadolint-action"
        versions:
          - "3.4.0"
          - "3.5.0"
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:50"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # OMERO.web 5.33.x requires Django >=5.2.9,<5.3. Keep CI typing aligned
      # with the deployed runtime while continuing to receive 5.2.x updates.
      - dependency-name: "django"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "django-stubs"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "django-stubs-ext"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps(ci-pip)"

  - package-ecosystem: "pip"
    directory: "/omeroweb_omp_plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(pip)"

  # Dependabot's Docker updater scans Dockerfiles, not Compose manifests.
  # Compose image tags remain explicit and are refreshed through audited bumps.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps(docker)"
