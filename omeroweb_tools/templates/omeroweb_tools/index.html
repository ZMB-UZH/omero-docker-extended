{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tools</title>
    <link rel="stylesheet" href="{% static 'omeroweb_admin_tools/styles.css' %}">
    <link rel="stylesheet" href="{% static 'omeroweb_tools/styles.css' %}">
</head>
<body{% if blocked_for_root %} class="root-user-blocked"{% endif %}>
    <div class="root-user-overlay" aria-hidden="true"></div>
    <div id="root-user-warning" class="root-user-warning" role="alert"></div>
    <div class="admin-tools-page">
        <div class="admin-tools-header">
            <h1 class="admin-tools-title">Tools</h1>
            <div class="admin-tools-header-actions">
                <a href="{% url 'omeroweb_tools_help' %}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="help-btn"
                   title="Help"
                   aria-label="Help">
                    ?
                </a>
            </div>
        </div>
        <div class="admin-tools-card">
            <div class="admin-tools-actions">
                <a class="admin-tools-button admin-tools-button-link"
                   href="{% url 'omeroweb_tools_enhanced_search' %}">
                   Enhanced search
                </a>
            </div>
        </div>
    </div>
    <script defer>
        const blockedForRoot = {{ blocked_for_root|yesno:"true,false" }};
        const rootStatusUrl = new URL('{% url "omeroweb_tools_root_status" %}', window.location.href);
        const warningEl = document.getElementById('root-user-warning');

        const setRootWarning = () => {
            if (!warningEl) {
                return;
            }
            warningEl.replaceChildren();
            warningEl.appendChild(document.createTextNode('PLEASE LOGIN AS REGULAR USER'));
            warningEl.appendChild(document.createElement('br'));
            warningEl.appendChild(document.createTextNode('TO USE THIS PLUGIN'));
            document.documentElement.classList.add('root-user-blocked');
            if (document.body) {
                document.body.classList.add('root-user-blocked');
            }
        };

        if (blockedForRoot) {
            setRootWarning();
        } else {
            fetch(rootStatusUrl, { credentials: 'same-origin' })
                .then((response) => (response.ok ? response.json() : null))
                .then((payload) => {
                    if (payload && payload.is_root_user) {
                        setRootWarning();
                    }
                })
                .catch(() => {
                    // Ignore root status lookup failures.
                });
        }
    </script>
</body>
</html>
