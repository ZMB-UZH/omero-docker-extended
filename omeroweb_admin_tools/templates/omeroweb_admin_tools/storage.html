{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin tools - Storage distribution</title>
    <link rel="stylesheet" href="{% static 'omeroweb_admin_tools/styles.css' %}">
</head>
<body>
<div class="admin-tools-page admin-tools-page--wide">
    <div class="admin-tools-header">
        <div class="admin-tools-header-left">
            <a class="admin-tools-back-link" href="{% url 'omeroweb_admin_tools_index' %}">← Back to admin tools</a>
            <h1 class="admin-tools-title">Storage capacity distribution viewer</h1>
        </div>
    </div>
    <div class="admin-tools-card admin-tools-card--wide">
        <div class="log-toolbar">
            <input id="search" class="log-input" type="text" placeholder="Search by user or group">
            <button type="button" id="refresh_btn" class="admin-tools-button log-refresh-button">Refresh now</button>
            <button type="button" id="export_btn" class="admin-tools-button log-refresh-button">Export CSV</button>
        </div>
        <div id="status" class="log-status">Ready.</div>
        <table class="log-table">
            <thead><tr><th>User</th><th>Group</th><th>Bytes</th></tr></thead>
            <tbody id="storage_table"></tbody>
        </table>
    </div>
</div>
<script defer>
const dataUrl = new URL('{% url "omeroweb_admin_tools_storage_data" %}', window.location.href);
const table = document.getElementById('storage_table');
const statusEl = document.getElementById('status');
const searchEl = document.getElementById('search');
let data = [];
let renderToken = 0;
const TABLE_ROW_CAP = 5000;
const RENDER_CHUNK_SIZE = 250;


function escapeHtml(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function cancelRender() {
    renderToken += 1;
}

function bytes(v) {
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let value = Number(v || 0);
    let idx = 0;
    while (value >= 1024 && idx < units.length - 1) { value /= 1024; idx += 1; }
    return `${value.toFixed(2)} ${units[idx]}`;
}

function render() {
    const needle = searchEl.value.trim().toLowerCase();
    const filteredRows = data.filter((row) => {
        if (!needle) {
            return true;
        }
        return row.username.toLowerCase().includes(needle) || row.group.toLowerCase().includes(needle);
    });
    const shownRows = filteredRows.slice(0, TABLE_ROW_CAP);
    cancelRender();
    const token = renderToken;
    if (!shownRows.length) {
        table.innerHTML = '<tr><td colspan="3" class="log-empty">No rows.</td></tr>';
    } else {
        table.innerHTML = '';
        let index = 0;
        const appendChunk = () => {
            if (token !== renderToken) {
                return;
            }
            const end = Math.min(index + RENDER_CHUNK_SIZE, shownRows.length);
            let html = '';
            for (; index < end; index += 1) {
                const row = shownRows[index];
                html += `<tr><td>${escapeHtml(row.username)}</td><td>${escapeHtml(row.group)}</td><td>${bytes(row.bytes)}</td></tr>`;
            }
            table.insertAdjacentHTML('beforeend', html);
            if (index < shownRows.length) {
                window.requestAnimationFrame(appendChunk);
            }
        };
        window.requestAnimationFrame(appendChunk);
    }

    const total = data.length;
    const suffix = filteredRows.length > TABLE_ROW_CAP
        ? ` Filter matched ${filteredRows.length} rows; showing first ${shownRows.length} (table cap: ${TABLE_ROW_CAP}).`
        : ` Showing ${shownRows.length} rows.`;
    statusEl.textContent = `Loaded ${total} rows.${suffix}`;
}

function exportCsv() {
    const header = 'username,group,bytes\n';
    const body = data.map((row) => `${JSON.stringify(row.username)},${JSON.stringify(row.group)},${row.bytes}`).join('\n');
    const blob = new Blob([header + body], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'omero-storage-distribution.csv';
    link.click();
    URL.revokeObjectURL(link.href);
}

async function loadData() {
    statusEl.textContent = 'Loading storage distribution...';
    try {
        const response = await fetch(dataUrl, { credentials: 'same-origin' });
        const payload = await response.json();
        if (!response.ok) {
            throw new Error(payload.error || `Request failed with status ${response.status}`);
        }
        data = payload.by_user_group || [];
        statusEl.textContent = `Loaded ${data.length} rows. OMERO binaries total: ${bytes(payload.totals.omero_binary_bytes)}.`;
        render();
    } catch (error) {
        data = [];
        render();
        statusEl.textContent = `Failed to load storage distribution: ${error.message}`;
    }
}

document.getElementById('refresh_btn').addEventListener('click', () => { loadData().catch(() => {}); });
document.getElementById('export_btn').addEventListener('click', exportCsv);
searchEl.addEventListener('input', render);
loadData().catch(() => {});
</script>
</body>
</html>
