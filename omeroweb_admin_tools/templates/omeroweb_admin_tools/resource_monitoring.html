{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin tools - Resource monitoring</title>
    <link rel="stylesheet" href="{% static 'omeroweb_admin_tools/styles.css' %}">
</head>
<body>
<div class="admin-tools-page admin-tools-page--wide">
    <div class="admin-tools-header">
        <div class="admin-tools-header-left">
            <a class="admin-tools-back-link" href="{% url 'omeroweb_admin_tools_index' %}">← Back to admin tools</a>
            <h1 class="admin-tools-title">Resource monitoring</h1>
        </div>
    </div>
    <div class="admin-tools-card admin-tools-card--wide">
        <div class="log-toolbar">
            <button type="button" id="open_grafana_btn" class="admin-tools-button log-refresh-button">Open Grafana</button>
            <button type="button" id="open_prometheus_btn" class="admin-tools-button log-refresh-button">Open Prometheus targets</button>
        </div>
        <div id="status" class="log-status">Loading resource dashboard...</div>
        <div id="monitoring_details" class="log-status"></div>
    </div>
</div>
<script defer>
const dataUrl = new URL('{% url "omeroweb_admin_tools_resource_monitoring_data" %}', window.location.href);
const statusEl = document.getElementById('status');
const openGrafanaBtn = document.getElementById('open_grafana_btn');
const openPrometheusBtn = document.getElementById('open_prometheus_btn');
const detailsEl = document.getElementById('monitoring_details');

function updateDetails(payload) {
    const grafanaProbe = payload?.grafana?.probe || {};
    const prometheusProbe = payload?.prometheus?.probe || {};
    const grafanaStatus = grafanaProbe.ok
        ? `Grafana backend reachable (status ${grafanaProbe.status}).`
        : `Grafana backend not reachable (${grafanaProbe.error || 'unknown error'}).`;
    const prometheusStatus = prometheusProbe.ok
        ? `Prometheus backend reachable (status ${prometheusProbe.status}).`
        : `Prometheus backend not reachable (${prometheusProbe.error || 'unknown error'}).`;
    detailsEl.textContent = `${grafanaStatus} ${prometheusStatus}`;
}

async function loadData() {
    statusEl.textContent = 'Loading resource dashboard...';
    detailsEl.textContent = '';
    try {
        const response = await fetch(dataUrl, { credentials: 'same-origin' });
        const payload = await response.json();
        if (!response.ok) {
            throw new Error(payload.error || `Request failed with status ${response.status}`);
        }
        const dashboardProxyUrl = payload?.grafana?.dashboard_proxy_url || payload?.grafana?.dashboard_url || '';
        const targetsProxyUrl = payload?.prometheus?.targets_proxy_url || payload?.prometheus?.targets_url || '';
        if (!dashboardProxyUrl || !targetsProxyUrl) {
            throw new Error('Monitoring endpoints are not configured.');
        }
        openGrafanaBtn.onclick = () => { window.open(dashboardProxyUrl, '_blank', 'noopener,noreferrer'); };
        openPrometheusBtn.onclick = () => { window.open(targetsProxyUrl, '_blank', 'noopener,noreferrer'); };
        updateDetails(payload);
        statusEl.textContent = `Updated at ${new Date(payload.timestamp).toLocaleString()}. Use "Open Grafana" to view the dashboard.`;
    } catch (error) {
        statusEl.textContent = `Failed to load monitoring dashboard: ${error.message}`;
    }
}

loadData().catch(() => {});
</script>
</body>
</html>
