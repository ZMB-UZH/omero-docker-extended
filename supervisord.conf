[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:omero-web]
command=/opt/omero/web/venv3/bin/python /opt/omero/web/venv3/bin/omero web start --foreground
directory=/opt/omero/web/OMERO.web
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:imaris-celery-worker]
command=/opt/omero/web/bin/start-imaris-celery-worker.sh
directory=/opt/omero/web/OMERO.web
autostart=true
autorestart=unexpected
exitcodes=0
startretries=3
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
