# Docker compose file of a minimal OMERO installation based on the official documentation, modified with many custom packages and plugins for enhanced functionality.
# Using the tag :latest for OMERO and databases might be tempting but is extremely risky! Have a backup plan!
# Always check compatibility in the following link or in the official OMERO documentation: https://omero.readthedocs.io/en/stable/sysadmins/version-requirements.html.

services:

  portainer:
    image: "portainer/portainer-ce:2.40.0-alpine"
    container_name: portainer
    restart: unless-stopped
    networks:
      omero:
        aliases:
          - portainer
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PORTAINER_DATA_PATH:?Set PORTAINER_DATA_PATH (run installation/installation_script.sh)}:/data:rw
    command: --http-enabled
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  loki:
    image: "grafana/loki:3.7.1"
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      omero:
        aliases:
          - loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${LOKI_DATA_PATH:?Set LOKI_DATA_PATH (run installation/installation_script.sh)}:/loki:rw
    healthcheck:
      test: ["CMD", "loki", "-version"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  alloy:
    image: "grafana/alloy:v1.16.1"
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/data-alloy"
      - "/etc/alloy/alloy-config.alloy"
    networks:
      omero:
        aliases:
          - alloy
    volumes:
      - ./monitoring/alloy/alloy-config.alloy:/etc/alloy/alloy-config.alloy:ro
      - ${ALLOY_DATA_PATH:?Set ALLOY_DATA_PATH (run installation/installation_script.sh)}:/data-alloy:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${OMERO_SERVER_LOGS_PATH:?Set OMERO_SERVER_LOGS_PATH (run installation/installation_script.sh)}:/logs/omeroserver:ro
      - ${OMERO_WEB_LOGS_PATH:?Set OMERO_WEB_LOGS_PATH (run installation/installation_script.sh)}:/logs/omeroweb:ro
      - ${OMERO_WEB_SUPERVISOR_LOGS_PATH:?Set OMERO_WEB_SUPERVISOR_LOGS_PATH (run installation/installation_script.sh)}:/logs/omeroweb-supervisor:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "alloy", "--help"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: "prom/prometheus:v3.11.3"
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        sed "s/__OMERO_CLI_PORT__/$${OMERO_CLI_PORT}/g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    environment:
      OMERO_CLI_PORT: "${OMERO_CLI_PORT:?Set OMERO_CLI_PORT in env/omeroserver.env}"
    networks:
      omero:
        aliases:
          - prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ${PROMETHEUS_DATA_PATH:?Set PROMETHEUS_DATA_PATH (run installation/installation_script.sh)}:/prometheus:rw
    depends_on:
      blackbox-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  blackbox-exporter:
    image: "prom/blackbox-exporter:v0.28.0"
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    networks:
      omero:
        aliases:
          - blackbox-exporter
    extra_hosts:
      - "crowdsec:host-gateway"
    volumes:
      - ./monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9115/-/healthy || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: "prom/node-exporter:v1.11.1"
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/textfile"
    pid: host
    networks:
      omero:
        aliases:
          - node-exporter
    volumes:
      - /:/host:ro,rslave
      - ${NODE_EXPORTER_TEXTFILE_PATH:?Set NODE_EXPORTER_TEXTFILE_PATH (run installation/installation_script.sh)}:/textfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:9100/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  path-usage-exporter:
    image: ${PATH_USAGE_EXPORTER_IMAGE:-path-usage-exporter:custom}
    build:
      context: .
      dockerfile: docker/path-usage-exporter.Dockerfile
    restart: unless-stopped
    networks:
      omero:
        aliases:
          - path-usage-exporter
    volumes:
      - ${NODE_EXPORTER_TEXTFILE_PATH:?Set NODE_EXPORTER_TEXTFILE_PATH (run installation/installation_script.sh)}:/textfile:rw
      - /:/host:ro,rslave
      - ./installation_paths.env:/config/installation_paths.env:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /textfile/omero_paths.prom"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: "ghcr.io/google/cadvisor:0.56.2"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      omero:
        aliases:
          - cadvisor
    volumes:
      - ./monitoring/cadvisor/entrypoint.sh:/entrypoint.sh:ro
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    tmpfs:
      - /dev/disk:ro,noexec,nosuid,nodev,size=1m,mode=0555
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/metrics || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    image: "prometheuscommunity/postgres-exporter:v0.19.1"
    restart: unless-stopped
    entrypoint: ["/postgres-exporter-entrypoint.sh"]
    command: ["--config.file=/etc/postgres-exporter/postgres_exporter.yml"]
    env_file:
      - ./env/omero_secrets.env
    environment:
      OMERO_POSTGRES_EXPORTER_SOURCE: main
    networks:
      omero:
        aliases:
          - postgres-exporter
    depends_on:
      database:
        condition: service_healthy
      database_plugin:
        condition: service_healthy
    volumes:
      - ./monitoring/postgres-exporter/entrypoint.sh:/postgres-exporter-entrypoint.sh:ro
      - ./monitoring/postgres-exporter/postgres_exporter.yml:/etc/postgres-exporter/postgres_exporter.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9187/metrics || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  postgres-exporter-plugin:
    image: "prometheuscommunity/postgres-exporter:v0.19.1"
    restart: unless-stopped
    entrypoint: ["/postgres-exporter-entrypoint.sh"]
    command: ["--config.file=/etc/postgres-exporter/postgres_exporter.yml"]
    env_file:
      - ./env/omero_secrets.env
    environment:
      OMERO_POSTGRES_EXPORTER_SOURCE: plugin
    networks:
      omero:
        aliases:
          - postgres-exporter-plugin
    depends_on:
      database_plugin:
        condition: service_healthy
    volumes:
      - ./monitoring/postgres-exporter/entrypoint.sh:/postgres-exporter-entrypoint.sh:ro
      - ./monitoring/postgres-exporter/postgres_exporter.yml:/etc/postgres-exporter/postgres_exporter.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9187/metrics || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis-exporter:
    image: "oliver006/redis_exporter:v1.83.0-alpine"
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    networks:
      omero:
        aliases:
          - redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9121/metrics || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  grafana:
    image: "grafana/grafana:13.0.1"
    restart: unless-stopped
    networks:
      omero:
        aliases:
          - grafana
    ports:
      - "3000:3000"
    env_file:
      - ./env/grafana.env
      - ./env/omero_secrets.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/omero-infrastructure.json
      GF_METRICS_ENABLED: "true"
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ${GRAFANA_DATA_PATH:?Set GRAFANA_DATA_PATH (run installation/installation_script.sh)}:/var/lib/grafana:rw
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboard-provider.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  database:
    image: "postgres:16.12"
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/postgres-entrypoint-from-env.sh"]
    env_file:
      - ./env/omero_secrets.env
    command:
      - "postgres"
      - "-c"
      - "timezone=Europe/Zurich"
      - "-c"
      - "log_timezone=Europe/Zurich"
    environment:
      OMERO_POSTGRES_PASSWORD_SOURCE: main
      POSTGRES_USER: omero
      POSTGRES_DB: omero
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Zurich
      PGTZ: Europe/Zurich
    networks:
      omero:
        aliases:
          - database
    volumes:
      - ./docker/postgres-entrypoint-from-env.sh:/usr/local/bin/postgres-entrypoint-from-env.sh:ro
      - ${OMERO_DATABASE_PATH:?Set OMERO_DATABASE_PATH (run installation/installation_script.sh)}:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  omeroserver:
    image: ${OMERO_SERVER_IMAGE:-omeroserver:custom}
    build:
      context: .
      dockerfile: docker/omero-server.Dockerfile
      args:
        OMERO_DROPBOX_VERSION: "${OMERO_DROPBOX_VERSION:?Set OMERO_DROPBOX_VERSION in env/omeroserver.env}"
        BIOFORMATS_VERSION: "${BIOFORMATS_VERSION:?Set BIOFORMATS_VERSION in env/omeroserver.env}"
    restart: unless-stopped
    # Startup reconciles bind-mounted runtime paths, then drops to omero-server.
    user: root
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./env/omeroserver.env
      - ./env/omero_secrets.env
      - ./env/omero-celery.env
    environment:
      # -----------------------------------------------------------------
      # OMERO_DATA_DIR / OMERO_DIR: CRITICAL — DO NOT REMOVE.
      # These tell the OMERO server where the bind-mounted data volume is.
      # Without them, the server resolves relative paths (e.g. omero.managed.dir)
      # against its install directory instead of /OMERO, causing imports to
      # land inside the container's ephemeral filesystem and be lost on restart.
      # -----------------------------------------------------------------
      OMERO_DATA_DIR: "${OMERO_DATA_DIR:?Set OMERO_DATA_DIR (run installation/installation_script.sh)}"
      OMERO_DIR: "${OMERO_DATA_DIR:?Set OMERO_DATA_DIR (run installation/installation_script.sh)}"
      OMERO_TMP_PATH: "${OMERO_TMP_PATH:?Set OMERO_TMP_PATH}"
      OMERO_TMPDIR: "${OMERO_TMP_PATH}/omero-server/tmp"
      OMERO_TEMPDIR: "${OMERO_TMP_PATH}/omero-server/tmp"
      TMPDIR: "${OMERO_TMP_PATH}/omero-server/tmp"
    hostname: omeroserver
    networks:
      omero:
        aliases:
          - omeroserver
    ports:
      - "${OMERO_SERVER_HOST_PORT:?Set OMERO_SERVER_HOST_PORT in env/omeroserver.env}:${OMERO_CLI_PORT:?Set OMERO_CLI_PORT in env/omeroserver.env}"
    volumes:
      - ${OMERO_USER_DATA_PATH:?Set OMERO_USER_DATA_PATH (run installation/installation_script.sh)}:/OMERO:rw
      - ${OMERO_SERVER_VAR_PATH:?Set OMERO_SERVER_VAR_PATH (run installation/installation_script.sh)}:/opt/omero/server/OMERO.server/var:rw
      - ${OMERO_SERVER_LOGS_PATH:?Set OMERO_SERVER_LOGS_PATH (run installation/installation_script.sh)}:/opt/omero/server/OMERO.server/var/log:rw
      - ${OMERO_TMP_PATH:?Set OMERO_TMP_PATH (run installation/installation_script.sh)}:${OMERO_TMP_PATH:?Set OMERO_TMP_PATH (run installation/installation_script.sh)}:rw
    ulimits:
      nofile:
        soft: 10000
        hard: 12000
    healthcheck:
      test:
        - CMD
        - /startup/healthcheck-omeroserver.sh
      interval: "${OMERO_SERVER_HEALTHCHECK_INTERVAL_SECONDS:?Set OMERO_SERVER_HEALTHCHECK_INTERVAL_SECONDS in env/omeroserver.env}s"
      timeout: "${OMERO_SERVER_HEALTHCHECK_TIMEOUT_SECONDS:?Set OMERO_SERVER_HEALTHCHECK_TIMEOUT_SECONDS in env/omeroserver.env}s"
      retries: "${OMERO_SERVER_HEALTHCHECK_RETRIES:?Set OMERO_SERVER_HEALTHCHECK_RETRIES in env/omeroserver.env}"
      start_period: "${OMERO_SERVER_HEALTHCHECK_START_PERIOD_SECONDS:?Set OMERO_SERVER_HEALTHCHECK_START_PERIOD_SECONDS in env/omeroserver.env}s"
    security_opt:
      - no-new-privileges:true

  redis-sysctl-init:
    image: ${REDIS_SYSCTL_INIT_IMAGE:-redis-sysctl-init:custom}
    build:
      context: .
      dockerfile: docker/redis-sysctl-init.Dockerfile
    container_name: redis-sysctl-init
    profiles:
      - sysctl-init
    user: root
    privileged: true
    restart: "no"
    command: []
    environment:
      SYSCTL_KEY: vm.overcommit_memory
      SYSCTL_VALUE: "1"
    network_mode: none
    security_opt:
      - no-new-privileges:true

  redis:
    image: "redis:8.6.3-alpine"
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "${REDIS_SAVE_POLICY?Set REDIS_SAVE_POLICY in .env}"
      - --appendonly
      - "${REDIS_APPENDONLY:?Set REDIS_APPENDONLY in .env}"
      - --maxmemory
      - "${REDIS_MAXMEMORY:?Set REDIS_MAXMEMORY in .env}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY:?Set REDIS_MAXMEMORY_POLICY in .env}"
    environment:
      TZ: Europe/Zurich
    networks:
      omero:
        aliases:
          - redis
    tmpfs:
      - /data:size=${REDIS_DATA_TMPFS_SIZE:?Set REDIS_DATA_TMPFS_SIZE in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  omeroweb:
    image: ${OMERO_WEB_IMAGE:-omeroweb:custom}
    build:
      context: .
      dockerfile: docker/omero-web.Dockerfile
      args:
        OMERO_CLI_ZARR_VERSION: "${OMERO_CLI_ZARR_VERSION:?Set OMERO_CLI_ZARR_VERSION in env/omeroserver.env}"
        OME_ZARR_PY_VERSION: "${OME_ZARR_PY_VERSION:?Set OME_ZARR_PY_VERSION in env/omeroserver.env}"
        BIOFORMATS2RAW_VERSION: "${BIOFORMATS2RAW_VERSION:?Set BIOFORMATS2RAW_VERSION in env/omeroserver.env}"
    restart: unless-stopped
    # Startup reconciles bind-mounted runtime paths, then drops to omero-web.
    user: root
    depends_on:
      omeroserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/omeroweb.env
      - ./env/omeroserver.env
      - ./env/omero_secrets.env
      - ./env/omero-celery.env
    networks:
      omero:
        aliases:
          - omeroweb
    environment:
      OMERO_DATA_DIR: "${OMERO_DATA_DIR:?Set OMERO_DATA_DIR (run installation/installation_script.sh)}"
      OMERO_TMP_PATH: "${OMERO_TMP_PATH:?Set OMERO_TMP_PATH}"
      OMERO_TMPDIR: "${OMERO_TMP_PATH}/omero-web/tmp"
      OMERO_TEMPDIR: "${OMERO_TMP_PATH}/omero-web/tmp"
      TMPDIR: "${OMERO_TMP_PATH}/omero-web/tmp"
    ports:
      - "${OMERO_WEB_HOST_PORT:?Set OMERO_WEB_HOST_PORT in env/omeroweb.env}:${CONFIG_omero_web_application__server_port:?Set CONFIG_omero_web_application__server_port in env/omeroweb.env}"
    volumes:
      - ${OMERO_USER_DATA_PATH:?Set OMERO_USER_DATA_PATH (run installation/installation_script.sh)}:/OMERO:rw
      - ./omero-web.config:/opt/omero/web/OMERO.web/etc/omero.web.config:ro
      - ${OMERO_TMP_PATH:?Set OMERO_TMP_PATH (run installation/installation_script.sh)}:${OMERO_TMP_PATH:?Set OMERO_TMP_PATH (run installation/installation_script.sh)}:rw
      - ${OMERO_WEB_VAR_PATH:?Set OMERO_WEB_VAR_PATH (run installation/installation_script.sh)}:/opt/omero/web/OMERO.web/var:rw
      - ${OMERO_WEB_LOGS_PATH:?Set OMERO_WEB_LOGS_PATH (run installation/installation_script.sh)}:/opt/omero/web/OMERO.web/var/log:rw
      - ${OMERO_WEB_SUPERVISOR_LOGS_PATH:?Set OMERO_WEB_SUPERVISOR_LOGS_PATH (run installation/installation_script.sh)}:/opt/omero/web/logs:rw
      - ${OMERO_SERVER_LOGS_PATH:?Set OMERO_SERVER_LOGS_PATH (run installation/installation_script.sh)}:/opt/omero/server/OMERO.server/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "port=\"$${CONFIG_omero_web_application__server_port:?Set CONFIG_omero_web_application__server_port}\"; curl -fsS \"http://127.0.0.1:$${port}/webgateway/\" >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  database_plugin:
    image: "postgres:16.12"
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/postgres-entrypoint-from-env.sh"]
    env_file:
      - ./env/omero_secrets.env
    command:
      - "postgres"
      - "-c"
      - "timezone=Europe/Zurich"
      - "-c"
      - "log_timezone=Europe/Zurich"
    environment:
      OMERO_POSTGRES_PASSWORD_SOURCE: plugin
      POSTGRES_USER: omero-plugin
      POSTGRES_DB: omero-plugin
      PGDATA: /var/lib/postgresql/data/pgdata
      PGPORT: 5433
      TZ: Europe/Zurich
      PGTZ: Europe/Zurich
    networks:
      omero:
        aliases:
          - database-plugin
    volumes:
      - ./docker/postgres-entrypoint-from-env.sh:/usr/local/bin/postgres-entrypoint-from-env.sh:ro
      - ${OMERO_PLUGIN_DATABASE_PATH:?Set OMERO_PLUGIN_DATABASE_PATH (run installation/installation_script.sh)}:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 -p 5433"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  pg-maintenance:
    image: ${PG_MAINTENANCE_IMAGE:-pg-maintenance:custom}
    build:
      context: .
      dockerfile: docker/pg-maintenance.Dockerfile
    container_name: pg-maintenance
    user: root
    restart: unless-stopped
    env_file:
      - ./env/omero_secrets.env
    environment:
      TZ: Europe/Zurich
      PGTZ: Europe/Zurich
      PGDATA: /var/lib/postgresql/data/pgmaintenance
      OMERO_DB_HOST: database
      OMERO_DB_PORT: 5432
      OMERO_DB_NAME: omero
      OMERO_DB_USER: omero
      PLUGIN_DB_HOST: database-plugin
      PLUGIN_DB_PORT: 5433
      PLUGIN_DB_NAME: omero-plugin
      PLUGIN_DB_USER: omero-plugin
    volumes:
      - ${PG_MAINTENANCE_DATA_PATH:?Set PG_MAINTENANCE_DATA_PATH (run installation/installation_script.sh)}:/var/lib/postgresql/data:rw
    networks:
      omero:
        aliases:
          - pg-maintenance
    depends_on:
      database:
        condition: service_healthy
      database_plugin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x cron >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  crowdsec:
    image: ${CROWDSEC_IMAGE:-crowdsec:custom}
    build:
      context: .
      dockerfile: docker/crowdsec.Dockerfile
    container_name: crowdsec
    user: root
    profiles:
      - crowdsec
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - ./env/omero_secrets.env
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd"
      DS_HOST_ROOT: "/host"
      CROWDSEC_INSTALL_BOOTSTRAP_ENROLL: "${CROWDSEC_INSTALL_BOOTSTRAP_ENROLL:-0}"
    volumes:
      - ./monitoring/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
      - ${CROWDSEC_DB_PATH:?Set CROWDSEC_DB_PATH (run installation/installation_script.sh)}:/var/lib/crowdsec/data/
      - ${CROWDSEC_CONFIG_PATH:?Set CROWDSEC_CONFIG_PATH (run installation/installation_script.sh)}:/etc/crowdsec/
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true


  ollama:
    image: "ollama/ollama:0.23.2"
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ${OLLAMA_DATA_PATH:-/disks/omero_temp/ollama}:/root/.ollama
    networks:
      omero:
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  omero:
