# Docker compose file of a minimal Omero installation based on the official documentation but modified for our server needs.
# Using the tag :latest might be tempting but is extremely risky! Have a backup plan!
# Always check compatibility in the following link or in the official Omero documentation: https://omero.readthedocs.io/en/stable/sysadmins/version-requirements.html
services:

  database:
    image: "postgres:18"
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "timezone=Europe/Zurich"
      - "-c"
      - "log_timezone=Europe/Zurich"
    environment:
      POSTGRES_USER: omero
      POSTGRES_DB: omero
      POSTGRES_PASSWORD: ShR3K413CPh0Q2r
      TZ: Europe/Zurich
      PGTZ: Europe/Zurich
    networks:
      - omero
    volumes:
      - database:/var/lib/postgresql:rw

  omeroserver:
    build:
      context: .
      dockerfile: Dockerfile.omero-server-custom
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Zurich
      CONFIG_omero_db_host: database
      CONFIG_omero_db_user: omero
      CONFIG_omero_db_pass: ShR3K413CPh0Q2r # must be the same as the database password
      CONFIG_omero_db_name: omero
      ROOTPASS: CsCN581JzgGsdyV # root account password, must be strong!!
      CONFIG_omero_security_login__failure__throttle__count: 5
      CONFIG_omero_security_login__failure__throttle__time: 60000
      CONFIG_omero_db_poolsize: 80 # max number should be less than 100 for the default Postgres settings
      OMERO_FIGURE_VERSION: "7.3.0" # change if you get a warning in Omero web -> Figure; it will say which version should be installed
      OMERO_JOB_SERVICE_USERNAME: "job-service"
      OMERO_JOB_SERVICE_PASS: "d8SvmBQ34f08xYv"
      OMERO_JOB_SERVICE_JOIN_ALL_GROUPS: "1"
    networks:
      - omero
    ports:
      - "4064:4064"
    volumes:
      - "omero:/OMERO"
    ulimits:
    # The following settings prevent the "Too many open file descriptors" error. Adjust for extremely large datasets (high content screening).
      nofile:
        soft: 50000
        hard: 50000

  redis: # shared cache across Omero web workers (required for rate limiting)
    image: "redis:7-alpine"
    restart: unless-stopped
    # Disable persistence for RAM storage only
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      TZ: Europe/Zurich
    networks:
      - omero
    tmpfs:
      - /data:size=512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  omeroweb:
    build:
      context: .
      dockerfile: Dockerfile.omero-web-custom
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Zurich
      OMEROHOST: omeroserver
      OMERO_PORT: 4064
      OMERO_WEB_UPLOAD_CONCURRENCY: 3
      OMERO_WEB_UPLOAD_BATCH_FILES: 5
      CONFIG_omero_security_transport: ssl
      CONFIG_omero_security_ssl: true
      OMP_HASH_SECRET: "8Fo8bCKntvhy8VJ46N0N3dvFe37nNY" # long secret code used for hashing by the plugin
      OMP_DATA_USER: omp-plugin
      OMP_DATA_PASS: VhVFL62ziQFo710
      OMP_DATA_PORT: 5433
      CONFIG_omero_web_application__server_port: 4090
      CONFIG_omero_web_session__cookie__secure: false
      CONFIG_omero_web_debug: true
      CONFIG_omero_web_time__zone: "Europe/Zurich"
      OMERO_WEB_VENV: venv-3.12 # ATTENTION!!! This needs to be updated to the correct venv when the developers update Omero Web
      # ---------------------------------------------------------------
      # Global service account for ALL background jobs (across plugins)
      # MUST match the OMERO.server-created user "job-service"
      # ---------------------------------------------------------------
      OMERO_JOB_SERVICE_USERNAME: "job-service"
      OMERO_JOB_SERVICE_PASS: "d8SvmBQ34f08xYv"
      OMERO_WEB_JOB_SERVICE_USERNAME: "job-service"
      OMERO_WEB_JOB_SERVICE_PASS: "d8SvmBQ34f08xYv"
      # Optional: force a fixed group id for job-service (otherwise job group is used)
      # OMERO_WEB_JOB_SERVICE_GROUP: "123"
      # Configure Django to use Redis for rate limiting
      CONFIG_omero_web_caches: '{"default": {"BACKEND": "django.core.cache.backends.redis.RedisCache", "LOCATION": "redis://redis:6379/1", "KEY_PREFIX": "omero", "TIMEOUT": 300}}'
      CONFIG_omero_web_apps: '["omero_figure","omero_iviewer","omero_mapr","omero_parade","omero_autotag","omero_tagsearch","omeroweb_omp_plugin","omeroweb_upload","omeroweb_admin_tools"]' # modify if needed when the developers update Omero Web
#      CONFIG_omero_web_open__with: '[
#        ["omero_fpbioimage", "fpbioimage_index", {
#          "script_url": "fpbioimage/openwith.js",
#          "supported_objects": ["image"],
#          "label": "FPBioimage"
#        }]
#      ]'
      CONFIG_omero_web_ui_top__links: '[
        ["Data", "webindex", {"title": "Browse Data via Projects, Tags etc"}],
        ["History", "history", {"title": "History"}],
        ["Mapr", {"viewname": "maprindex_anyvalue"}, {"title": "Find Any Value"}],
        ["Figure", "figure_index", {"title": "Open Figure in new tab", "target": "_blank"}],
        ["Help", "https://help.openmicroscopy.org/", {"title": "Open OMERO user guide in a new tab", "target": "new"}],
        ["Tag Search", "tagsearch"],
        ["OMP plugin", "omeroweb_omp_plugin_index", {"title": "Open OMP plugin in new tab", "target": "_blank"}],
        ["Upload", "omeroweb_upload_index", {"title": "Open Upload in new tab", "target": "_blank"}],
        ["Admin tools", "omeroweb_admin_tools_index", {"title": "Open Admin tools in new tab", "target": "_blank"}]
      ]' # modify if needed when the developers update Omero Web
      CONFIG_omero_web_login__logo: "/static/branding/logo.png" # optional, delete if you don't want a custom logo at the top of the login page
    networks:
      - omero
    ports:
      - "4090:4090"
    volumes:
      - omero:/OMERO
      - ./omero-web.config:/opt/omero/web/OMERO.web/etc/omero.web.config:ro
      - omero_upload:/opt/tmp:rw
    tmpfs:
      - /tmp/omp_plugin_filename_metadata_jobs:size=256m,mode=1777

  database_plugin: # database exclusive to the OME plugin
    image: "postgres:18"
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "timezone=Europe/Zurich"
      - "-c"
      - "log_timezone=Europe/Zurich"
    environment:
      POSTGRES_USER: omp-plugin
      POSTGRES_DB: omp-plugin
      POSTGRES_PASSWORD: VhVFL62ziQFo710
      PGPORT: 5433
      TZ: Europe/Zurich
      PGTZ: Europe/Zurich
    networks:
      - omero
    volumes:
      - database_plugin:/var/lib/postgresql:rw

networks:
  omero:

volumes:
  database:
  omero:
  omero_upload:
  database_plugin:
