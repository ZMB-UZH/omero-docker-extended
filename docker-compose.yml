# Docker compose file of a minimal Omero installation based on the official documentation, but modified with many custom packages and plugins for enhanced functionality.
# Using the tag :latest for Omero and databases might be tempting but is extremely risky! Have a backup plan!
# Always check compatibility in the following link or in the official Omero documentation: https://omero.readthedocs.io/en/stable/sysadmins/version-requirements.html
services:

  loki:
    image: "grafana/loki:latest"
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - omero
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  alloy:
    image: "grafana/alloy:latest"
    restart: unless-stopped
    command:
      - "run"
      - "/etc/alloy/alloy-config.alloy"
    networks:
      - omero
    volumes:
      - ./monitoring/alloy/alloy-config.alloy:/etc/alloy/alloy-config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:12345/-/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  database:
    image: "postgres:18"
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "timezone=Europe/Zurich"
      - "-c"
      - "log_timezone=Europe/Zurich"
    environment:
      POSTGRES_USER: omero
      POSTGRES_DB: omero
      POSTGRES_PASSWORD: ShR3K413CPh0Q2r
      TZ: Europe/Zurich
      PGTZ: Europe/Zurich
    networks:
      - omero
    volumes:
      - database:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

  omeroserver:
    build:
      context: .
      dockerfile: Dockerfile.omero-server-custom
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./omeroserver.env
    networks:
      - omero
    ports:
      - "4064:4064"
    volumes:
      - "omero:/OMERO"
    ulimits:
    # The following settings prevent the "Too many open file descriptors" error. Adjust for extremely large datasets (high content screening).
      nofile:
        soft: 15000
        hard: 15000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/omero/server/OMERO.server/bin/omero -s localhost -p 4064 login >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: "redis:8-alpine"
    restart: unless-stopped
    # Disable persistence for RAM storage only
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      TZ: Europe/Zurich
    networks:
      - omero
    tmpfs:
      - /data:size=512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

  omeroweb:
    build:
      context: .
      dockerfile: Dockerfile.omero-web-custom
    restart: unless-stopped
    depends_on:
      omeroserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./omeroweb.env
    networks:
      - omero
    ports:
      - "4090:4090"
    volumes:
      - omero:/OMERO
      - ./omero-web.config:/opt/omero/web/OMERO.web/etc/omero.web.config:ro
      - omero_upload:/opt/tmp:rw
    tmpfs:
      - /tmp/omp_plugin_filename_metadata_jobs:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4090/webgateway/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  database_plugin:
    image: "postgres:18"
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "timezone=Europe/Zurich"
      - "-c"
      - "log_timezone=Europe/Zurich"
    environment:
      POSTGRES_USER: omp-plugin
      POSTGRES_DB: omp-plugin
      POSTGRES_PASSWORD: VhVFL62ziQFo710
      PGPORT: 5433
      TZ: Europe/Zurich
      PGTZ: Europe/Zurich
    networks:
      - omero
    volumes:
      - database_plugin:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

networks:
  omero:

volumes:
  database:
  omero:
  omero_upload:
  database_plugin:
