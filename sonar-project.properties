# SonarQube Cloud project configuration
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/ci-based-analysis/github-actions-for-sonarcloud

sonar.organization=zmb-uzh
sonar.projectKey=ZMB-UZH_omero-docker-extended
sonar.sourceEncoding=UTF-8

# Python coverage report produced by the tests step in the workflow
sonar.python.coverage.reportPaths=coverage.xml

# Suppress duplication noise in test code (test helpers are repetitive by design)
sonar.cpd.exclusions=**/tests/**,**/test/**
