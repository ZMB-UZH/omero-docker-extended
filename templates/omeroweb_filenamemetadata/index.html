<div class="omeroweb-filenamemetadata"
     id="filename_metadata_container"
     style='padding:36px; max-width:560px; margin:0 auto; --base-font-size:14px; font-size:var(--base-font-size);'>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;">
        <h1 style='color:#007bff; margin:0;'>Filename-Metadata plugin</h1>
        <a href="/omeroweb_filenamemetadata/help/"
           target="_blank"
           rel="noopener noreferrer"
           title="Help"
           aria-label="Help"
           class="help-btn">
            ?
        </a>
    </div>

    <form method='POST'
          id="preview_form"
          style='background:#f8f9fa;padding:24px;border-radius:10px;border:2px solid #007bff;'>
        <div style='margin-bottom:20px;'>
            <label><strong>Project:</strong></label><br>
            <div style='display:flex; align-items:center; justify-content:space-between; width:100%;'>
                <select name='project'
                        id='project_select'
                        style='width:55%; padding:12px;border-radius:6px;border:1px solid #007bff;'>
                    <option value=''>Select project…</option>
                    {% for pid, name in projects %}
                        <option value='{{ pid }}'>{{ name }}</option>
                    {% endfor %}
                </select>
                <button type='button'
                        id='dataset_selection_btn'
                        style='padding:12px 16px;font-size:14px;background:#007bff;color:white;border:none;border-radius:8px; flex:0 0 auto;'>
                    Dataset selection
                </button>
            </div>
        </div>

        <div id='dataset_table_container'
             style='display:none; margin-bottom:20px; border:1px solid #007bff; border-radius:8px; background:#fff;'>
            <div style='padding:12px; border-bottom:1px solid #007bff; font-weight:600; color:#007bff;'>
                Datasets in selected project
            </div>
            <div style='max-height:240px; overflow:auto;'>
                <table style='width:100%; border-collapse:collapse; font-size:13px;'>
                    <thead style='background:#f1f5f9; position:sticky; top:0;'>
                    <tr>
                        <th style='padding:8px; text-align:left; border-bottom:1px solid #e2e8f0; width:40px;'>
                            <input type='checkbox' id='datasets_select_all' checked>
                        </th>
                        <th style='padding:8px; text-align:left; border-bottom:1px solid #e2e8f0;'>Dataset</th>
                        <th style='padding:8px; text-align:left; border-bottom:1px solid #e2e8f0;'>ID</th>
                        <th style='padding:8px; text-align:left; border-bottom:1px solid #e2e8f0;'>Images</th>
                        <th style='padding:8px; text-align:left; border-bottom:1px solid #e2e8f0;'>File type(s)</th>
                    </tr>
                    </thead>
                    <tbody id='dataset_table_body'></tbody>
                </table>
            </div>
            <div id='dataset_table_message' style='padding:10px 12px; display:none; color:#b91c1c;'></div>
        </div>

        <div style='margin-bottom:20px;'>
            <label><strong>Input for filename parsing:</strong></label><br>

            <input type='hidden'
                   name='separator_mode'
                   id='separator_mode'
                   value='chars'>

            <div style='display:flex; align-items:flex-start; gap:14px;'>
                <input type='text'
                       id='separator_input'
                       name='separator'
                       value='_-'
                       style='width:55%;padding:12px;border-radius:6px;border:1px solid #007bff;'>

                <div style='display:flex; flex-direction:column; gap:8px; margin-top:-4px;'>
                    <label style='display:flex; align-items:center; gap:8px; font-weight:600;'>
                        <input type='checkbox'
                               id='sep_mode_chars'
                               checked
                               onclick='setSeparatorMode("chars")'>
                        <span>Character(s)</span>
                    </label>

                    <label style='display:flex; align-items:center; gap:8px; font-weight:600;'>
                        <input type='checkbox'
                               id='sep_mode_regex'
                               onclick='setSeparatorMode("regex")'>
                        <span>Regex pattern</span>
                    </label>
                </div>
            </div>
        </div>

        <input type='hidden' name='selected_datasets' id='selected_datasets' value=''>
        <input type='hidden' name='dataset_selection_opened' id='dataset_selection_opened' value='0'>

        <button type='submit'
                style='width:80%;padding:18px;font-size:14px;background:#007bff;color:white;
                       border:none;border-radius:8px; display:block; margin:0 auto;'>
            Load images & Preview
        </button>
    </form>

    <!-- NON-BLOCKING MODAL -->
    <div id="nb-modal-overlay"
         style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3);
                z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#ffffff; padding:20px 24px; border-radius:8px;
                    box-shadow:0 10px 30px rgba(0,0,0,0.25);
                    font-size:13px; min-width:300px; max-width:500px;">
            <div id="nb-modal-message"
                 style="margin-bottom:16px;">
            </div>
            <div style="text-align:right;">
                <button onclick="hideNonBlockingModal()"
                        style="padding:6px 14px; font-size:12px;">
                    OK
                </button>
            </div>
        </div>
    </div>

    <style>
        .help-btn {width:26px; height:26px; border-radius:50%; background:#007bff; color:white; font-size:14px; font-weight:700;
                    line-height:26px; text-align:center; text-decoration:none; box-shadow:0 1px 4px rgba(0,0,0,0.25); cursor:pointer;
                    transition: background 0.15s ease, transform 0.1s ease;}
        .help-btn:hover {background:#0056b3; transform: translateY(-1px);}
        .omeroweb-filenamemetadata.expanded {max-width:900px;}
    </style>

    <script>
    const previewForm = document.getElementById('preview_form');
    function setSeparatorMode(mode) {
        const chars = document.getElementById('sep_mode_chars');
        const regex = document.getElementById('sep_mode_regex');
        const hidden = document.getElementById('separator_mode');

        if (mode === 'regex') {
            regex.checked = true;
            chars.checked = false;
            hidden.value = 'regex';
        } else {
            chars.checked = true;
            regex.checked = false;
            hidden.value = 'chars';
        }
    }

    // Ensure exactly one mode is selected even if browser restores form state
    (function initSeparatorMode() {
        const chars = document.getElementById('sep_mode_chars');
        const regex = document.getElementById('sep_mode_regex');
        if (regex && regex.checked) {
            setSeparatorMode('regex');
        } else {
            setSeparatorMode('chars');
        }
    })();

    const datasetButton = document.getElementById('dataset_selection_btn');
    const projectSelect = document.getElementById('project_select');
    const datasetTableContainer = document.getElementById('dataset_table_container');
    const datasetTableBody = document.getElementById('dataset_table_body');
    const datasetTableMessage = document.getElementById('dataset_table_message');
    const datasetSelectAll = document.getElementById('datasets_select_all');
    const selectedDatasetsInput = document.getElementById('selected_datasets');
    const separatorInput = document.getElementById('separator_input');
    const filenameMetadataContainer = document.getElementById('filename_metadata_container');
    const datasetSelectionOpenedInput = document.getElementById('dataset_selection_opened');

    function showNonBlockingModal(message) {
        const overlay = document.getElementById("nb-modal-overlay");
        const msg = document.getElementById("nb-modal-message");
        if (msg) msg.innerText = message;
        if (overlay) overlay.style.display = "flex";
    }

    function hideNonBlockingModal() {
        const overlay = document.getElementById("nb-modal-overlay");
        if (overlay) overlay.style.display = "none";
    }

    if (previewForm) {
        previewForm.addEventListener('submit', (event) => {
            if (!projectSelect.value) {
                event.preventDefault();
                showNonBlockingModal("Select a project first.");
                return;
            }
            if (datasetSelectionOpenedInput?.value === '1' && !selectedDatasetsInput.value) {
                event.preventDefault();
                showNonBlockingModal("Please select one or more datasets first.");
                return;
            }
            if (!separatorInput.value.trim()) {
                event.preventDefault();
                showNonBlockingModal("The input field for filename parsing cannot be empty.");
            }
        });
    }

    {% if error_message %}
    showNonBlockingModal("{{ error_message|escapejs }}");
    {% endif %}

    function updateSelectedDatasets() {
        const checked = datasetTableBody.querySelectorAll('input[type="checkbox"][data-dataset-id]:checked');
        const ids = Array.from(checked).map((input) => input.dataset.datasetId);
        selectedDatasetsInput.value = ids.join(',');
        if (datasetSelectAll) {
            const allBoxes = datasetTableBody.querySelectorAll('input[type="checkbox"][data-dataset-id]');
            datasetSelectAll.checked = allBoxes.length > 0 && checked.length === allBoxes.length;
        }
    }

    function renderDatasetRows(datasets) {
        datasetTableBody.innerHTML = '';
        if (!datasets || datasets.length === 0) {
            datasetTableMessage.textContent = 'No datasets found for this project.';
            datasetTableMessage.style.display = 'block';
            datasetSelectAll.checked = false;
            selectedDatasetsInput.value = '';
            return;
        }
        datasetTableMessage.style.display = 'none';
        datasetSelectAll.checked = true;

        datasets.forEach((ds) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="padding:8px; border-bottom:1px solid #e2e8f0;">
                    <input type="checkbox" data-dataset-id="${ds.id}" checked>
                </td>
                <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${ds.name || ''}</td>
                <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${ds.id || ''}</td>
                <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${ds.image_count}</td>
                <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${ds.file_types || ''}</td>
            `;
            datasetTableBody.appendChild(row);
        });

        datasetTableBody.querySelectorAll('input[type="checkbox"][data-dataset-id]')
            .forEach((input) => input.addEventListener('change', updateSelectedDatasets));

        updateSelectedDatasets();
    }

    if (datasetSelectAll) {
        datasetSelectAll.addEventListener('change', () => {
            const checked = datasetSelectAll.checked;
            datasetTableBody.querySelectorAll('input[type="checkbox"][data-dataset-id]')
                .forEach((input) => {
                    input.checked = checked;
                });
            updateSelectedDatasets();
        });
    }

    if (datasetButton) {
        datasetButton.addEventListener('click', () => {
            const projectId = projectSelect.value;
            if (!projectId) {
                showNonBlockingModal("Select a project first.");
                return;
            }

            datasetSelectionOpenedInput.value = '1';
            if (filenameMetadataContainer) {
                filenameMetadataContainer.classList.add('expanded');
            }
            datasetTableMessage.style.display = 'none';
            datasetTableContainer.style.display = 'block';
            datasetTableBody.innerHTML = '<tr><td colspan="5" style="padding:12px;">Loading datasets…</td></tr>';

            const formData = new FormData();
            formData.append('action', 'list_datasets');
            formData.append('project', projectId);

            fetch(window.location.href, {
                method: 'POST',
                body: formData,
            })
                .then((resp) => resp.json())
                .then((data) => {
                    if (data.error) {
                        datasetTableBody.innerHTML = '';
                        datasetTableMessage.textContent = data.error;
                        datasetTableMessage.style.display = 'block';
                        datasetSelectAll.checked = false;
                        selectedDatasetsInput.value = '';
                        return;
                    }
                    renderDatasetRows(data.datasets || []);
                })
                .catch(() => {
                    datasetTableBody.innerHTML = '';
                    datasetTableMessage.textContent = 'Unable to load datasets. Please try again.';
                    datasetTableMessage.style.display = 'block';
                    datasetSelectAll.checked = false;
                    selectedDatasetsInput.value = '';
                });
        });
    }
    </script>

</div>
